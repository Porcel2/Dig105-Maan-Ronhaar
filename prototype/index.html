<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodu prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--mint:#BFE3D6;--ink:#16201D;--terra:#D9643A;--green:#0E5A4C;--ivory:#F6F2EA;--muted:#56605C;--line:#D8D2C6;--white:#FFFFFF;--body:#3B4541;--yellow:#F2C14E;--err:#C2451C;--ground:#E9E4DA}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#phone{width:390px;height:844px;max-width:100%;background:var(--ivory);border-radius:44px;border:1px solid var(--line);overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(22,32,29,.18)}
@media (max-width:430px){#stage{padding:0}#phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 20px 0;gap:18px;overflow-y:auto;animation:in .28s ease-out}
.screen>*{flex-shrink:0}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.screen.back{animation-name:inb}
.screen.still{animation:none}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1{font-size:30px}h2{font-size:28px}
p{margin:0;line-height:1.5}
.sub{font-size:15px;color:var(--body)}
.muted{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:12px 0 28px}
.center{text-align:center}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
.btn{height:56px;width:100%;border-radius:28px;border:none;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px}
.btn.p{background:var(--green);color:#fff}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.g{background:var(--mint);color:var(--ink)}
.btn.a{background:var(--terra);color:#fff}
.btn:disabled{background:#E4DED3;color:#9AA29E;border:none;cursor:default}
.btn.sm{height:44px;font-size:15px;width:auto}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.social{height:52px;flex:1;border:1px solid var(--line);border-radius:26px;background:#fff;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f span.l{font-size:13px;font-weight:700;color:var(--muted)}
.in{height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px}
.in input,.in select{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.in input::placeholder{color:#9AA29E}
.in:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,90,76,.12)}
.in.err{border-color:var(--terra)}
.errt{font-size:13px;color:var(--err);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--body);cursor:pointer}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.chk input:checked+.box{background:var(--green);border-color:var(--green)}
.chk input:focus-visible+.box{box-shadow:0 0 0 3px rgba(14,90,76,.25)}
.chk .box svg{opacity:0}.chk input:checked+.box svg{opacity:1}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.role{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);cursor:pointer;width:100%;text-align:left;font:inherit}
.role.on{border-color:var(--green)}
.role .ic{width:52px;height:52px;border-radius:16px;background:var(--ivory);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.role.on .ic{background:var(--mint)}
.role b{font-family:'Sora',sans-serif;font-size:17px;display:block}
.role small{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.radio{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);background:#fff;flex-shrink:0}
.on>.radio,.radio.on{border:6px solid var(--green)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--mint);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--body)}
.prog{flex:1;display:flex;gap:4px;margin:0 16px}.prog span{flex:1;height:4px;border-radius:2px;background:#E4DED3}.prog span.on{background:var(--green)}
.otp{display:flex;gap:10px}.otp input{width:48px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-family:'Sora',sans-serif;font-weight:700;font-size:22px;outline:none;color:var(--ink)}
.otp input:focus{border-color:var(--green)}.otp input.filled{border-color:var(--green)}
.lang{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.lang.on{border-color:var(--green)}
.lang .hd{display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;background:none;border:none;padding:0;font:inherit;text-align:left}
.lang .code{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;width:32px}
.lang .nm{flex:1;font-size:15px}
.lvls{display:flex;gap:4px}.lvls button{height:28px;padding:0 9px;border-radius:14px;font-size:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--line)}
.lvls button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{width:52px;height:32px;border-radius:16px;background:#D8D2C6;position:relative;border:none;flex-shrink:0;padding:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on:after{left:23px}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;width:100%;font:inherit;text-align:left;cursor:pointer}
.pm.on{border-color:var(--green)}
.pm .tag{width:44px;height:30px;border-radius:7px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pm b{display:block;font-size:15px}.pm small{font-size:13px;color:var(--muted)}
.photo{width:92px;height:92px;border-radius:14px;border:1.5px dashed var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font:inherit}
.photo.done{border:none;background:linear-gradient(135deg,#9CC9B8,#5E8F80);color:#fff;font-weight:700}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700}
.pill.ok{background:var(--green);color:#fff}.pill.rev{background:var(--yellow);color:var(--ink)}
.link{color:var(--green);font-weight:700;background:none;border:none;padding:0;font:inherit;font-weight:700;cursor:pointer}
.greet{position:relative;height:300px;border-radius:28px;background:var(--mint);display:flex;align-items:center;justify-content:center}
.bub{position:absolute;padding:8px 14px;background:#fff;border-radius:16px 16px 16px 4px;font-size:14px;font-weight:500}
.toast{pointer-events:none;position:absolute;left:20px;right:20px;top:60px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;animation:in .2s;z-index:5}
.toast.err{background:var(--terra)}
.rolesw{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;background:rgba(22,32,29,.08);border-radius:14px;padding:2px;gap:2px}.rolesw button{height:22px;padding:0 10px;border-radius:12px;border:none;background:transparent;font:inherit;font-size:11px;font-weight:700;color:var(--muted)}.rolesw button.on{background:var(--ink);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.devbar{position:fixed;right:12px;top:12px;background:rgba(22,32,29,.85);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;display:flex;gap:10px;align-items:center;z-index:9}
.devbar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:3px 10px;font-size:12px}
@media (max-width:430px){.devbar{display:none}}

.lc{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:13px;white-space:nowrap}.lc span{color:var(--muted)}.lc.on{background:var(--mint);border-color:var(--mint)}
.bd{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap}
.pc{display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;font:inherit;color:var(--ink);text-align:left}
.bnav{position:sticky;bottom:0;margin:auto -20px 0;width:calc(100% + 40px);z-index:4;display:flex;height:84px;border-top:1px solid var(--line);background:#fff;padding-bottom:18px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;background:none;border:none;font:inherit;font-size:12px;color:var(--muted)}
.bnav button.on{color:var(--ink);font-weight:700}.pil{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative}.bnav .on .pil{background:var(--mint)}
.nb{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.pil .nb{position:absolute;top:-4px;right:2px}
.cat{height:92px;border-radius:18px;border:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink)}
.jobcard{width:100%;background:var(--ink);border:none;border-radius:20px;padding:16px;color:#fff;text-align:left;font:inherit}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0}.stat b{font-family:Sora,sans-serif;font-size:19px}.stat small{font-size:12px;color:var(--muted)}
.day{width:44px;height:60px;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid var(--line);font:inherit;color:var(--ink)}.day small{font-size:11px;opacity:.75}.day b{font-size:17px}.day.off{color:#A9AFAB;background:transparent;border-color:transparent}.day.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot{height:40px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font:inherit;font-size:14px;font-weight:600;color:var(--ink)}.slot.sel{background:var(--green);border-color:var(--green);color:#fff}
.cta{position:sticky;bottom:0;margin:auto -20px 0;width:calc(100% + 40px);z-index:4;padding:12px 20px 28px;background:var(--ivory);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ta{min-height:96px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:12px 16px;font:inherit;font-size:16px;color:var(--ink);resize:vertical;outline:none}.ta:focus{border-color:var(--green)}
.sheetbg{position:absolute;inset:0;background:rgba(22,32,29,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}.eic{width:72px;height:72px;border-radius:36px;background:var(--mint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.qcard{width:82%;background:#fff;border:1.5px solid var(--green);border-radius:18px 18px 18px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bub2{max-width:80%;background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}.bub2.me{background:var(--green);color:#fff;border:none;border-radius:18px 18px 4px 18px}.orig{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:flex-start}.me .orig{color:rgba(255,255,255,.72)}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
.starb{font-size:40px;line-height:1;background:none;border:none;color:#D8D2C6;padding:0}.starb.on{color:var(--yellow)}
.pill.dark{background:var(--ink);color:#fff}.pill.gray{background:#E9E4DA;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--green)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ch{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cc{position:relative;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;background:#fff;border:1px solid #EDE8DF;font-family:inherit;color:var(--ink);padding:0}.cc:disabled{color:#A9AFAB;cursor:default}.cc.sel{background:var(--ink)!important;color:#fff;border-color:var(--ink)}.cc.empty{background:transparent;border:none}.cc.has{cursor:pointer;border-color:var(--line)}.cc.has:hover,.cc.pin{background:var(--mint);border-color:var(--mint)}.cc.today b{color:var(--terra)}
.dots2{display:flex;gap:2px;height:5px}.dots2 i{width:5px;height:5px;border-radius:3px;display:block}.lg{width:8px;height:8px;border-radius:4px;display:inline-block}
.pop{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(22,32,29,.16);z-index:20;text-align:left;cursor:default}.cc:nth-child(7n+1) .pop,.cc:nth-child(7n+2) .pop{left:0;transform:none}.cc:nth-child(7n) .pop,.cc:nth-child(7n-1) .pop{left:auto;right:0;transform:none}
.cc.has:hover .pop,.cc.pin .pop,.cc.has:focus-within .pop{display:block}
.prow{position:relative;padding:6px;border-radius:10px;cursor:pointer}.prow:hover,.prow.pin,.prow:focus{background:var(--ivory)}.dotc{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.tip{display:none;position:absolute;left:100%;top:0;margin-left:8px;width:240px;background:var(--ink);color:#fff;border-radius:14px;padding:12px;box-shadow:0 12px 30px rgba(22,32,29,.25);z-index:30;cursor:default}.tip .muted{color:rgba(255,255,255,.7)}.tip .chip{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}.tip b{color:#fff}
.prow:hover .tip,.prow.pin .tip,.prow:focus .tip{display:block}
@media (max-width:520px){.tip{left:0;top:100%;margin:6px 0 0}}

.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.mini{flex-shrink:0;width:118px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--ink);text-align:center}.mini b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hero{width:100%;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;font:inherit;color:var(--ink);text-align:left}

.greet.wl{height:214px;background:linear-gradient(160deg,#CDEBE0,#BFE3D6 55%,#B2DDCD);overflow:hidden}
.greet.wl .bub{animation:floaty 4s ease-in-out infinite;box-shadow:0 6px 16px rgba(22,32,29,.08)}
.f1{animation-delay:0s}.f2{animation-delay:.6s}.f3{animation-delay:1.2s}.f4{animation-delay:1.8s}.f5{animation-delay:2.4s;font-size:13px;padding:6px 12px}.f6{animation-delay:3s;font-size:13px;padding:6px 12px}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.greet.wl svg{filter:drop-shadow(0 10px 20px rgba(22,32,29,.18))}
.greet.wl .kd{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .3s forwards}
.greet.wl .dt{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.5,1) 1.3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}
.facepile{display:inline-flex;align-items:center;height:32px;background:var(--mint);border-radius:16px;padding:0 12px 0 3px;white-space:nowrap}
.fp{width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:10px;border:2px solid #fff;margin-right:-8px}.fpt{margin-left:14px;font-size:12px;font-weight:700}
.rot{display:inline-grid;color:var(--green)}.rot span{grid-area:1/1;animation:rotw 10s infinite;opacity:0}.rot span:nth-child(1){animation-delay:0s}.rot span:nth-child(2){animation-delay:2s}.rot span:nth-child(3){animation-delay:4s}.rot span:nth-child(4){animation-delay:6s}.rot span:nth-child(5){animation-delay:8s}
@keyframes rotw{0%{opacity:0;transform:translateY(8px)}4%,18%{opacity:1;transform:none}22%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.greet.wl .bub,.rot span,.greet.wl .kd,.greet.wl .dt{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}.rot span:not(:first-child){display:none}}
</style>
</head>
<body>
<div id="stage"><div id="phone" role="application" aria-label="Kodu prototype"><div id="rolesw" class="rolesw"><button data-switch="expat">Expat</button><button data-switch="provider">Provider</button></div></div></div>
<div class="devbar"><span>Prototype</span><button data-dev="reset">Reset all</button><button data-switch="expat">Expat view</button><button data-switch="provider">Provider view</button></div>
<script>
const I = {
  back:'<path d="M15 5l-7 7 7 7"/>',check:'<path d="M5 12l5 5 9-10"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',

function readForm(form){form.querySelectorAll("input[name]").forEach(i=>{if(i.type==="checkbox")S[i.name]=i.checked;else S[i.name]=i.value})}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-switch],[data-go],[data-role],[data-act],[data-chip],[data-lang],[data-lvl],[data-tog],[data-doc],[data-dev]");if(!t)return;
  const form=t.closest("form");if(form)readForm(form);

  if(t.dataset.role){S.role=t.dataset.role;save();if(route==="welcome"){go("account")}else render();return}

  if(t.dataset.chip){const k=t.dataset.chip,v=t.dataset.val;if(k==="jobs"){S.jobs=S.jobs.includes(v)?S.jobs.filter(x=>x!==v):[...S.jobs,v]}else{S[k]=v;if(k==="trade")S.jobs=[]}save();render();return}

  if(t.dataset.lvl){S.langs[t.dataset.lvl]=t.dataset.val;save();render();return}

document.addEventListener("submit",e=>{

const av=(p,s=52)=>`<span style="width:${s}px;height:${s}px;border-radius:50%;background:${p.bg};display:inline-flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:${Math.round(s*.36)}px;color:${p.bg==="#0E5A4C"||p.bg==="#D9643A"?"#fff":"#16201D"};flex-shrink:0">${p.ini}</span>`;
const lchip=([c,l])=>`<span class="lc ${myLangs().includes(c)?"on":""}"><b>${c}</b> <span>${l}</span></span>`;
const badge=b=>{const m={"Verified ID":["shield","#0E5A4C","#fff"],"Licensed":["check","#16201D","#BFE3D6"],"Top rated":["star","#16201D","#F2C14E"],"Escrow protected":["lock","#fff","#0E5A4C"]}[b];return `<span class="bd" style="background:${m[2]};color:${m[1]}">${ico(m[0],m[1],14)}${b}</span>`};
const why=p=>{const s=speaks(p);return s?`<b style="color:var(--green)">Speaks ${LNAME[s[0]]} ${s[1]}</b>`:`<b style="color:var(--green)">Translated chat</b>`};
const pcard=(p,compact)=>`<button class="pc" data-open="${p.id}"><span class="row" style="gap:12px;width:100%">${av(p)}<span style="flex:1;min-width:0;text-align:left"><span class="row" style="gap:6px"><b style="font-family:Sora,sans-serif;font-size:17px">${p.name}</b>${ico("shield","#0E5A4C",16)}</span><span class="muted" style="display:block;font-size:14px">${p.trade}  ·  ${p.area}</span>${stars(p.rating,p.reviews)}</span><span style="text-align:right;flex-shrink:0"><b style="font-family:Sora,sans-serif;font-size:18px;display:block">€${p.pricing==="job"?p.jobPrice:p.rate}</b><span class="muted" style="font-size:12px">${p.pricing==="job"?"per job":"per hour"}</span></span></span><span class="row wrap" style="gap:6px;width:100%">${p.langs.slice(0,3).map(lchip).join("")}</span>${compact?"":`<span class="row between" style="width:100%"><span class="muted">${why(p)}  ·  Replies in ~${p.reply}</span><span class="btn g sm" style="height:36px;padding:0 16px">View</span></span>`}</button>`;
const nav=a=>{const n=Object.values(S.chats).filter(c=>c.unread).length;return `<nav class="bnav">${[["ehome","search","Search"],["bookings","calendar","Bookings"],["chats","chat","Chats"],["me","user","Profile"]].map(([r,i,l])=>`<button data-nav="${r}" class="${a===r?"on":""}" aria-current="${a===r?"page":"false"}"><span class="pil">${ico(i,"#16201D",22)}${r==="chats"&&n?`<span class="nb">${n}</span>`:""}</span><span>${l}</span></button>`).join("")}</nav>`};
const topbar=()=>`<div class="row between" style="height:48px"><div class="row" style="gap:8px">${mark(28,"#F6F2EA")}<span style="font-family:Sora,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em">kodu</span></div><button class="chip" style="height:40px" data-act="soon" aria-label="Change language">${ico("globe","#16201D",18)} ${myLang()}</button></div>`;
const sbar=(q,active)=>`<form data-form="search" class="in" style="border-radius:26px;height:52px">${ico("search","#56605C",20)}<input name="q" placeholder="Plumber, electrician, painter…" value="${esc(q)}" autocomplete="off"><button type="button" class="ib" data-go="filters" aria-label="Filters" style="width:36px;height:36px;margin-right:-8px;position:relative;background:var(--ivory);border:none">${ico("filter","#16201D",20)}${active?`<span class="nb" style="position:absolute;top:-4px;right:-4px">${active}</span>`:""}</button></form>`;
const sh=(t,a,act)=>`<div class="row between" style="align-items:baseline"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em">${t}</span>${a?`<button class="link" style="font-size:14px" ${act}>${a}</button>`:""}</div>`;

function results(){
  ensure();const f=S.f,q=S.q.toLowerCase();
  let r=P.filter(p=>!q||p.trade.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||p.tags.some(t=>t.toLowerCase().includes(q)));
  if(S.cat)r=r.filter(p=>p.cat===S.cat);
  if(f.area)r=r.filter(p=>p.area===f.area);
  if(f.verified)r=r.filter(p=>p.badges.includes("Verified ID"));
  r=r.filter(p=>p.city===f.city);
  if(f.lang)r=r.filter(p=>speaksSel(p));
  if(f.pricing)r=r.filter(p=>p.pricing===f.pricing);
  r=r.filter(p=>p.pricing==="job"||p.rate<=f.max);
  if(f.avail==="Today")r=r.filter(p=>p.slots.Tue);
  if(f.avail==="Weekends")r=r.filter(p=>p.slots.Sat||p.slots.Sun);
  const inWin=t=>{const h=+t.slice(0,2);return f.time===""||(f.time==="Morning"&&h<12)||(f.time==="Afternoon"&&h>=12&&h<16)||(f.time==="Evening"&&h>=16)};
  if(f.day||f.time)r=r.filter(p=>Object.entries(p.slots).some(([d,ss])=>(!f.day||d===f.day)&&ss.some(inWin)));
  if(f.minR)r=r.filter(p=>p.rating>=f.minR);
  if(f.lic)r=r.filter(p=>p.badges.includes("Licensed"));
  if(f.fast)r=r.filter(p=>p.reply.includes("min")&&parseInt(p.reply)<=30);
  const sort={"Best match":(a,b)=>(speaks(b)?1:0)-(speaks(a)?1:0)||b.rating-a.rating,"Highest rated":(a,b)=>b.rating-a.rating,"Lowest price":(a,b)=>a.rate-b.rate,"Nearest":(a,b)=>(a.area==="Kesklinn"?-1:1)-(b.area==="Kesklinn"?-1:1)}[f.sort];
  return r.sort(sort);
}
const activeFilters=()=>{ensure();const f=S.f;return (f.lang?1:0)+(f.verified?1:0)+(f.avail!=="This week"?1:0)+(f.max<60?1:0)+(f.area?1:0)+(f.day?1:0)+(f.time?1:0)+(f.minR?1:0)+(f.lic?1:0)+(f.fast?1:0)+(f.city!=="Tallinn"?1:0)+(f.pricing?1:0)};

${sbar("",activeFilters())}

<div class="col"><b style="font-family:Sora,sans-serif;font-size:17px">Why you can trust ${p.name.split(" ")[0]}</b><div class="card" style="padding:4px 14px">${[["shield","Identity checked","Document verified by our partner"],["check",p.badges.includes("Licensed")?"Licence on file":"Trade experience declared","Shown on request"],["lock","Escrow on every job","Pay only when you confirm the work"]].map(([i,t,s])=>`<div class="row" style="gap:12px;padding:10px 0;border-bottom:1px solid #EDE8DF"><span class="eic" style="width:36px;height:36px;border-radius:11px">${ico(i,"#16201D",18)}</span><span><b style="font-size:15px">${t}</b><span class="muted" style="display:block">${s}</span></span></div>`).join("")}</div></div>

<div style="height:12px"></div><div class="cta"><span style="width:78px"><b style="font-family:Sora,sans-serif;font-size:20px">€${p.pricing==="job"?p.jobPrice:p.rate}<span class="muted" style="font-size:13px;font-weight:500">${p.pricing==="job"?" per job":"/h"}</span></b><span class="muted" style="display:block;font-size:12px">quote before work</span></span><button class="btn g" style="width:100px;height:52px;font-size:15px" data-chat="${p.id}">Message</button><button class="btn p" style="flex:1;height:52px;font-size:15px;white-space:nowrap" data-book="${p.id}">Request quote</button></div>`},

book:()=>{const p=find(S.view);const d=S.draft;return `${bar(1,3)}${head("Describe the job",`${p.name.split(" ")[0]} replies with a written quote before any work starts.`)}
<form data-form="book" class="col" style="gap:14px">
<label class="f"><span class="l">What needs doing</span><div class="in ${err.title?"err":""}"><input name="title" placeholder="Leaking kitchen tap" value="${esc(d.title||"")}"></div>${err.title?`<span class="errt">${err.title}</span>`:""}</label>
<label class="f"><span class="l">Details</span><textarea name="desc" class="ta" placeholder="When it started, where it is, anything you have tried. Write in ${LNAME[myLang()]}, ${p.name.split(" ")[0]} reads it in ${LNAME[native(p)]}.">${esc(d.desc||"")}</textarea></label>
<div class="col"><span class="muted" style="font-weight:700">Photos</span><div class="row">${["Photo 1","Photo 2"].map(k=>`<button type="button" class="photo ${d[k]?"done":""}" data-dphoto="${k}">${d[k]?ico("check","#fff",22):ico("plus","#56605C",20)}${d[k]?"Added":"Add photo"}</button>`).join("")}</div></div>
<div class="col"><span class="muted" style="font-weight:700">Urgency</span>${chips("urgency",["Flexible","This week","Urgent"],S.urgency||"This week")}</div>
<div class="note">${ico("pin","#16201D",16)}<span>${p.name.split(" ")[0]} sees your district (${(S.address||"Kesklinn").split(",")[1]||"Kesklinn"}) now and the full address once you pay.</span></div>
<div class="foot"><button class="btn p" type="submit">Choose a time</button></div></form>`},

slots:()=>{const p=find(S.view);const d=S.draft;const day=d.day||Object.keys(p.slots)[0];return `${bar(2,3)}${head("Pick a time",`${p.name.split(" ")[0]}'s free slots this week. Jobs usually take one to two hours.`)}
<div class="row" style="gap:6px">${DAYS.map(([dd,n])=>`<button class="day ${p.slots[dd]?"":"off"} ${day===dd?"sel":""}" data-day="${dd}" ${p.slots[dd]?"":"disabled"}><small>${dd}</small><b>${n}</b></button>`).join("")}</div>
<div class="row wrap" style="gap:8px">${(p.slots[day]||[]).map(s=>`<button class="slot ${d.day===day&&d.slot===s?"sel":""}" data-pick="${s}">${s}</button>`).join("")}</div>
${err.slot?`<span class="errt">${err.slot}</span>`:""}
<div class="card col" style="gap:4px"><span class="muted" style="font-weight:700">Estimate</span><div class="row between"><span>${p.pricing==="job"?"Fixed price per job":"1.5 h × €"+p.rate}</span><b>€${(p.pricing==="job"?p.jobPrice:1.5*p.rate).toFixed(2)}</b></div><p class="muted">Final price comes in ${p.name.split(" ")[0]}'s quote. Materials and the 10% Kodu fee are shown before you pay.</p></div>
<div class="foot"><button class="btn p" data-act="sendRequest">Send request</button></div>`},

job:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);const q=quote(j);return `${bar()}<div class="row between"><h2>${esc(j.title)}</h2>${pill(j.status)}</div>
<div class="card row" style="gap:12px">${av(p,44)}<span style="flex:1"><b>${p.name}</b><span class="muted" style="display:block">${p.trade}  ·  ${j.day} ${j.slot}</span></span><button class="btn g sm" style="height:40px" data-chat="${p.id}">Chat</button></div>
${j.status==="requested"?`<div class="note">${ico("globe","#16201D",16)}<span>Request sent and translated to ${LNAME[native(p)]}. ${p.name.split(" ")[0]} usually replies in ~${p.reply}. Prototype: open the chat to receive the quote.</span></div>`:""}
${j.status!=="requested"?`<div class="card col" style="gap:0;padding:6px 16px">${[[p.pricing==="job"?"Fixed price for the job":"Labour  "+j.hours+" h × €"+p.rate,money(q.labour)],["Materials  "+j.matDesc,money(j.materials)],["Kodu service fee 10%",money(q.fee)]].map(([a,b])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid #EDE8DF;font-size:15px"><span>${a}</span><b style="font-family:Sora,sans-serif">${b}</b></div>`).join("")}<div class="row between" style="padding:12px 0;font-size:17px;color:var(--green)"><b>${j.status==="paid"||j.status==="done"?"Held in escrow":"Total to hold in escrow"}</b><b style="font-family:Sora,sans-serif">${money(q.total)}</b></div></div>`:""}
${j.status==="paid"?`<div class="note">${ico("lock","#16201D",16)}<span>Paid ${j.paidAt}. Released to ${p.name.split(" ")[0]} when you confirm the job is done, or automatically 72 h after the visit.</span></div>`:""}
${j.status==="done"?`<div class="note">${ico("check","#16201D",16)}<span>Completed. ${money(q.total)} released to ${p.name.split(" ")[0]}. Receipt KD 2026 ${j.id.slice(-4)} is in your email.</span></div>`:""}
<div class="col"><b style="font-family:Sora,sans-serif;font-size:17px">Details</b><p class="sub">${esc(j.desc||"No extra details.")}</p><div class="row wrap"><span class="chip">${j.urgency}</span>${j.photos?`<span class="chip">${j.photos} photos</span>`:""}</div></div>
<div class="foot">${j.status==="quoted"?`<button class="btn a" data-go="pay">${ico("lock","#fff",20)}Pay ${money(q.total)} securely</button><button class="btn s" data-act="declineQuote">Decline quote</button>`:j.status==="paid"?`<button class="btn p" data-act="confirmDone">Confirm job is done</button><button class="btn s" data-act="cancel">Cancel booking</button>`:j.status==="done"?(j.rated?`<p class="center muted">Thanks for your review.</p>`:`<button class="btn p" data-go="rate">Rate ${p.name.split(" ")[0]}</button>`):j.status==="requested"?`<button class="btn s" data-act="cancel">Cancel request</button>`:""}</div>`},

pay:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);const q=quote(j);S.payMethod=S.payMethod||"Visa";return `${bar()}${head("Pay securely","Money is held by Kodu, not sent to the provider, until you confirm the job.")}
<div class="card col" style="gap:0;padding:6px 16px">${[["Labour",money(q.labour)],["Materials",money(j.materials)],["Kodu service fee",money(q.fee)]].map(([a,b])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid #EDE8DF;font-size:15px"><span>${a}</span><b style="font-family:Sora,sans-serif">${b}</b></div>`).join("")}<div class="row between" style="padding:12px 0;font-size:17px;color:var(--green)"><b>Total held in escrow</b><b style="font-family:Sora,sans-serif">${money(q.total)}</b></div></div>
<div class="col">${[["Visa","Ending 4421","VISA"],["Apple Pay",first()+"'s iPhone","APPL"],["Revolut","Ending 0912","REV"]].map(([t,s,g])=>`<button class="pm ${S.payMethod===t?"on":""}" data-pay="${t}"><span class="tag">${g}</span><span style="flex:1"><b>${t}</b><small>${s}</small></span><span class="radio ${S.payMethod===t?"on":""}"></span></button>`).join("")}</div>
<div class="note">${ico("lock","#16201D",16)}<span><b>Held in escrow.</b> Released to ${p.name.split(" ")[0]} when you confirm, or automatically 72 h after the visit. Cancelling within 24 h of the slot costs €15.</span></div>

<div class="foot"><button class="btn a" data-act="payNow">${ico("lock","#fff",20)}Pay ${money(q.total)} with ${S.payMethod}</button></div>`},

paid:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);return `<div class="col center" style="margin:auto 0;align-items:center;gap:14px"><span class="eic" style="width:120px;height:120px;border-radius:60px">${ico("check","#0E5A4C",56)}</span><h2>Booked for ${j.day} ${j.slot}</h2><p class="sub">${money(quote(j).total)} is held safely. ${p.name.split(" ")[0]} has your full address now and will message you in ${LNAME[myLang()]}.</p>

<div class="foot"><button class="btn p" data-chat="${p.id}">Open chat with ${p.name.split(" ")[0]}</button><button class="btn s" data-nav="bookings">See my bookings</button></div>`},

rate:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);S.rv=S.rv||{stars:0,tags:[]};return `${bar()}<div class="col center" style="align-items:center;gap:12px">${av(p,72)}<h2>How was ${p.name.split(" ")[0]}?</h2><p class="sub">Only expats can review, and reviews are shown with your language.</p>
<div class="row" style="gap:8px">${[1,2,3,4,5].map(i=>`<button class="starb ${i<=S.rv.stars?"on":""}" data-star="${i}" aria-label="${i} stars">★</button>`).join("")}</div>

<div style="height:12px"></div>${nav("bookings")}`},

chats:()=>{ensure();const list=Object.values(S.chats).sort((a,b)=>b.t-a.t);return `${topbar()}<h2>Chats</h2>${list.length?`<div class="col" style="gap:0">${list.map(c=>{const p=find(c.pid);const last=c.msgs[c.msgs.length-1];return `<button class="row" style="gap:12px;padding:12px 0;border-bottom:1px solid #EDE8DF;background:none;border-left:none;border-right:none;border-top:none;font:inherit;text-align:left;width:100%" data-chat="${p.id}">${av(p,48)}<span style="flex:1;min-width:0"><span class="row between"><b>${p.name}</b><span class="muted" style="font-size:12px">${last.when}</span></span><span class="muted" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${c.unread?"color:var(--ink);font-weight:700":""}">${esc(last.text)}</span></span>${c.unread?`<span class="nb">${c.unread}</span>`:""}</button>`}).join("")}</div>`:`<div class="empty"><span class="eic">${ico("chat","#16201D",30)}</span><b style="font-family:Sora,sans-serif;font-size:18px">No chats yet</b><p class="muted">Message any provider from their profile. Every chat is translated both ways.</p></div>`}
<div style="height:12px"></div>${nav("chats")}`},

chat:()=>{ensure();const p=find(S.view);const c=S.chats[p.id];c.unread=0;const pl=native(p);return `<div class="row" style="gap:10px;height:48px"><button class="ib" data-go="back" aria-label="Back">${ico("back")}</button>${av(p,40)}<span style="flex:1"><b style="display:block">${p.name}</b><span class="muted" style="font-size:12px">${p.trade}  ·  replies in ~${p.reply}</span></span><button class="ib" data-open="${p.id}" aria-label="View profile">${ico("user","#16201D",20)}</button></div>
<div class="muted center" style="font-size:12px">Translated ${myLang()} ⇄ ${pl} automatically  ·  <button class="link" style="font-size:12px;color:var(--muted)" data-act="togOrig">${S.showOrig===false?"Show originals":"Hide originals"}</button></div>
<div class="col" style="gap:10px" id="msgs">${c.msgs.map(m=>m.sys?`<div class="muted center" style="font-size:12px;padding:4px 0">${m.text}</div>`:m.quote?(()=>{const j=S.jobs2.find(x=>x.id===m.quote);const q=quote(j);return `<div class="row"><div class="qcard"><div class="row between"><span style="font-size:13px;font-weight:700;color:var(--green)">Quote from ${p.name.split(" ")[0]}</span>${pill(j.status)}</div><b style="font-family:Sora,sans-serif;font-size:22px">${money(q.total)}</b><span class="muted">${p.pricing==="job"?"fixed price":j.hours+" h labour"}, ${j.matDesc}, ${j.day} ${j.slot}</span>${j.status==="quoted"?`<div class="row" style="gap:8px"><button class="btn p sm" style="flex:1" data-job="${j.id}">View and pay</button><button class="btn s sm" style="flex:1" data-act="declineQuote" data-jid="${j.id}">Decline</button></div>`:""}</div></div>`})():`<div class="row" style="justify-content:${m.me?"flex-end":"flex-start"}"><div class="bub2 ${m.me?"me":""}"><span>${esc(m.text)}</span>${S.showOrig===false?"":`<span class="orig">${ico("globe",m.me?"rgba(255,255,255,.7)":"#56605C",12)} ${m.me?`Delivered in ${LNAME[pl]}`:`${pl}: ${esc(m.orig)}`}</span>`}</div></div>`).join("")}${c.typing?`<div class="row"><div class="bub2" style="padding:12px 16px"><span class="dots"><i></i><i></i><i></i></span></div></div>`:""}</div>

<div style="height:12px"></div><form data-form="msg" class="cta" style="gap:8px"><button type="button" class="ib" data-act="attach" aria-label="Attach photo">${ico("plus","#16201D",20)}</button><div class="in" style="flex:1;border-radius:22px;height:44px"><input name="msg" placeholder="Write in ${LNAME[myLang()]}…" autocomplete="off"></div><button class="ib" type="submit" style="background:var(--green);border:none" aria-label="Send">${ico("send","#fff",20)}</button></form>`},

me:()=>{ensure();return `${topbar()}<div class="row" style="gap:14px"><span style="width:64px;height:64px;border-radius:32px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:22px">${(S.name||"S R").split(" ").map(x=>x[0]).join("").slice(0,2)}</span><span><h2 style="font-size:22px">${esc(S.name||"Sofia Ramírez")}</h2><span class="muted">${esc(S.email||"")}</span><span class="row wrap" style="gap:6px;margin-top:6px">${Object.entries(S.langs).map(lchip).join("")}</span></span></div>
<div class="card" style="padding:4px 16px">${[["globe","Language and translation",`App in ${LNAME[myLang()]}, chat translated`],["pin","Home",esc(S.address||"Not set")],["lock","Payment methods","Visa ending 4421"],["shield","Verification","Email and phone confirmed"],["star","Saved providers",S.saved.length+" saved"],["user","Privacy and data","Download or delete your data"]].map(([i,t,s])=>`<button class="row" style="gap:12px;padding:12px 0;border-bottom:1px solid #EDE8DF;width:100%;background:none;border-left:none;border-right:none;border-top:none;font:inherit;text-align:left" data-act="soon"><span class="eic" style="width:40px;height:40px;border-radius:12px">${ico(i,"#16201D",20)}</span><span style="flex:1"><b style="font-size:16px;font-weight:500">${t}</b><span class="muted" style="display:block">${s}</span></span><span style="display:inline-flex;transform:rotate(180deg)">${ico("back","#56605C",18)}</span></button>`).join("")}</div>
<div class="row between" style="font-size:15px"><span>Show originals under translations</span><button class="tog ${S.showOrig===false?"":"on"}" data-act="togOrig" role="switch" aria-checked="${S.showOrig!==false}"></button></div>
<button class="btn p" data-switch="provider">Switch to the provider app</button><button class="btn s" data-act="logout">Log out</button><p class="muted center">Kodu prototype  ·  v0.2</p>
<div style="height:12px"></div>${nav("me")}`}
});

/* provider replies, scripted for the prototype */
const REPLY=(p,j)=>({
  text:`Yes, ${j.day} ${j.slot} works. I can see the ${j.title.toLowerCase()} from your photos. Here is my quote.`,
  orig:{ET:`Jah, ${j.day} ${j.slot} sobib. Näen fotodelt ${j.title.toLowerCase()}. Siin on minu pakkumine.`,UK:`Так, ${j.day} ${j.slot} підходить. Бачу проблему на фото. Ось моя пропозиція.`,RU:`Да, ${j.day} ${j.slot} подходит. Вижу проблему на фото. Вот моё предложение.`,PT:`Sim, ${j.day} ${j.slot} dá. Vi o problema nas fotos. Aqui está o meu orçamento.`}[native(p)]||"…"
});
const CHITCHAT=[["Thanks, received. I will bring the parts.","Aitäh, sain kätte. Võtan osad kaasa."],["Could you send one more photo from the side?","Kas saadad veel ühe foto küljelt?"],["No problem, see you then.","Pole probleemi, kohtumiseni."]];
function openChat(pid){ensure();if(!S.chats[pid]){const p=find(pid);S.chats[pid]={pid,t:Date.now(),unread:0,msgs:[{sys:true,text:`Chat with ${p.name.split(" ")[0]} started · translated automatically`}]}}S.view=pid;save();go("chat")}
function providerReplies(pid){const c=S.chats[pid];const p=find(pid);const j=S.jobs2.find(x=>x.pid===pid&&x.status==="requested");c.typing=true;save();if(route==="chat"&&S.view===pid)render();
  setTimeout(()=>{c.typing=false;if(j){j.status="quoted";j.hours=1.5;j.materials=MAT[p.cat][1];j.matDesc=MAT[p.cat][0];const r=REPLY(p,j);c.msgs.push({text:r.text,orig:r.orig,when:"now"});c.msgs.push({quote:j.id,when:"now"})}else{const [t,o]=CHITCHAT[c.msgs.length%CHITCHAT.length];c.msgs.push({text:t,orig:o,when:"now"})}
    c.t=Date.now();if(!(route==="chat"&&S.view===pid))c.unread=(c.unread||0)+1;save();render();},1800)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-open],[data-cat],[data-catf],[data-f],[data-fv],[data-fvn],[data-city],[data-langsel],[data-save],[data-book],[data-chat],[data-job],[data-day],[data-pick],[data-dphoto],[data-pay],[data-star],[data-rtag],[data-act]");if(!t)return;ensure();
  const d=t.dataset;
  if(d.nav){history=[];go(d.nav);return}
  if(d.open){S.view=d.open;S.recent=[d.open,...(S.recent||[]).filter(x=>x!==d.open)].slice(0,8);save();go("profile");return}
  if(d.cat!==undefined){S.cat=d.cat;S.q="";save();if(route==="search")render();else go("search");return}
  if(d.catf!==undefined){S.cat=d.catf;save();render();return}
  if(d.f!==undefined&&t.tagName!=="INPUT"){S.f[d.f]=!S.f[d.f];save();render();return}
  if(d.fv){S.f[d.fv]=d.val;save();render();return}
  if(d.fvn){S.f[d.fvn]=+d.val;save();render();return}
  if(d.city){S.f.city=d.city;S.f.area="";save();render();return}
  if(d.langsel!==undefined){if(d.langsel==="any"){S.f.lang=false;S.f.langSel=""}else{S.f.lang=true;S.f.langSel=d.langsel}save();render();return}
  if(d.save){S.saved=S.saved.includes(d.save)?S.saved.filter(x=>x!==d.save):[...S.saved,d.save];save();render();toast(S.saved.includes(d.save)?"Saved":"Removed from saved");return}
  if(d.book){S.view=d.book;S.draft=d.day?{day:d.day,slot:d.slot}:{};save();go("book");return}

  if(a==="togOrig"){S.showOrig=S.showOrig===false?true:false;save();render();return}

  if(a==="sendRequest"){if(!S.draft.slot){err={slot:"Pick a time slot"};render();return}const p=find(S.view);const id="j"+Date.now();const j={id,pid:p.id,title:S.draft.title,desc:S.draft.desc,urgency:S.urgency||"This week",photos:["Photo 1","Photo 2"].filter(k=>S.draft[k]).length,day:S.draft.day,slot:S.draft.slot,status:"requested",hours:1.5,materials:0,matDesc:""};S.jobs2.push(j);S.jobId=id;if(!S.chats[p.id])openChat(p.id);const c=S.chats[p.id];c.msgs.push({me:true,text:`Hi ${p.name.split(" ")[0]}, ${j.title.toLowerCase()}. ${j.desc||""} Could you come ${j.day} at ${j.slot}?`,orig:`(${LNAME[myLang()]} original)`,when:"now"});c.t=Date.now();S.draft={};save();history=[];go("job");toast("Request sent and translated");providerReplies(p.id);return}
  if(a==="declineQuote"){const j=S.jobs2.find(x=>x.id===(d.jid||S.jobId));j.status="cancelled";save();render();toast("Quote declined");return}
  if(a==="payNow"){const j=S.jobs2.find(x=>x.id===S.jobId);j.status="paid";j.paidAt="today";save();go("paid");return}
  if(a==="confirmDone"){const j=S.jobs2.find(x=>x.id===S.jobId);j.status="done";save();render();toast(money(quote(j).total)+" released to "+find(j.pid).name.split(" ")[0]);return}
  if(a==="cancel"){const j=S.jobs2.find(x=>x.id===S.jobId);if(confirm(j.status==="paid"?"Cancel this booking? Cancelling within 24 h of the slot costs €15.":"Cancel this request?")){j.status="cancelled";save();render();toast("Cancelled")}return}
  if(a==="sendReview"){if(!S.rv.stars){toast("Pick a star rating","err");return}const j=S.jobs2.find(x=>x.id===S.jobId);j.rated=true;const ta=document.querySelector("textarea[name=rvtext]");if(ta)S.rv.text=ta.value;S.rv={stars:0,tags:[]};save();history=[];go("bookings");toast("Review sent, thank you");return}
});
document.addEventListener("submit",e=>{

});

function pcal(){
  const first=3; // 1 Oct 2026 is a Thursday; Monday based grid
  const byDay={};S.pjobs.filter(j=>j.status!=="declined"&&j.status!=="cancelled").forEach(j=>{(byDay[j.date]=byDay[j.date]||[]).push(j)});
  const dot={new:"#F2C14E",quoted:"#F2C14E",paid:"#0E5A4C",done:"#0E5A4C",released:"#16201D"};
  const dname=d=>["Thu","Fri","Sat","Sun","Mon","Tue","Wed"][(d-1)%7];
  const sel=S.calDay;const js=(byDay[sel]||[]).sort((a,b)=>a.slot.localeCompare(b.slot));
  const cells=[];for(let i=0;i<first;i++)cells.push('<span class="cc empty"></span>');
  for(let d=1;d<=31;d++){const n=(byDay[d]||[]).length;cells.push(`<button class="cc ${n?"has":""} ${d===11?"today":""} ${sel===d?"sel":""}" data-cal="${d}" aria-label="${dname(d)} ${d} October, ${n} jobs" ${n?"":"disabled"}><b>${d}</b><span class="dots2">${(byDay[d]||[]).slice(0,3).map(j=>`<i style="background:${dot[j.status]}"></i>`).join("")}</span></button>`)}
  const panel=sel?`<div class="card col" style="gap:8px;background:var(--ivory)"><div class="row between"><b style="font-family:Sora,sans-serif;font-size:16px">${dname(sel)} ${sel} October</b><span class="muted">${js.length} ${js.length===1?"job":"jobs"}</span></div>
    ${js.map(j=>{const e=ex(j.eid);const q=pq(j);const open=S.calJob===j.id;return `<div class="card col" style="gap:8px;padding:10px 12px;${open?"border-color:var(--green)":""}"><button class="row" style="gap:10px;width:100%;background:none;border:none;padding:0;font:inherit;text-align:left" data-caljob="${j.id}">${exav(e,36)}<span style="flex:1;min-width:0"><b style="font-size:15px;display:block">${e.name}</b><span class="muted" style="font-size:13px">${j.slot}  ·  ${esc(j.title)}</span></span><span class="dotc" style="background:${dot[j.status]}"></span><span style="display:inline-flex;transform:rotate(${open?"90deg":"180deg"})">${ico("back","#56605C",18)}</span></button>
      ${open?`<div class="col" style="gap:8px;border-top:1px solid #EDE8DF;padding-top:8px"><span class="muted" style="font-size:13px">${LNAME[e.lang]} speaker  ·  ${e.area}${j.status==="paid"||j.status==="released"?", Narva mnt 7":""}  ·  ${pSpeaks(e)?"you share "+LNAME[pSpeaks(e)[0]]:"translated chat"}</span><p class="sub" style="font-size:14px">${esc(j.desc)}</p><div class="row wrap" style="gap:4px">${ppill(j.status)}<span class="chip" style="height:26px;font-size:12px">${j.day} ${j.slot}</span><span class="chip" style="height:26px;font-size:12px">${S.pricing==="job"?"fixed price":j.hours+" h"}</span>${j.photos?`<span class="chip" style="height:26px;font-size:12px">${j.photos} photos</span>`:""}</div><div class="row between" style="font-size:14px"><span class="muted">${j.status==="new"?"Not quoted yet":j.status==="released"?"Paid out":"You receive"}</span><b style="font-family:Sora,sans-serif;color:var(--green)">${j.status==="new"?"":money(q.net)}</b></div><div class="row" style="gap:8px"><button class="btn p sm" style="flex:1" data-preq="${j.id}">${j.status==="new"?"Open and quote":"Open job"}</button><button class="btn g sm" data-pchat="${e.id}">Chat</button></div></div>`:""}</div>`}).join("")}</div>`:`<p class="muted">Tap a date with dots to see its jobs.</p>`;
  return `<div class="card col" style="gap:10px"><div class="row between"><b style="font-family:Sora,sans-serif;font-size:17px">October 2026</b><span class="row" style="gap:10px;font-size:12px;color:var(--muted)"><span class="row" style="gap:4px"><i class="lg" style="background:#F2C14E"></i>requested</span><span class="row" style="gap:4px"><i class="lg" style="background:#0E5A4C"></i>booked</span><span class="row" style="gap:4px"><i class="lg" style="background:#16201D"></i>paid out</span></span></div>
  <div class="cal"><span class="ch">Mon</span><span class="ch">Tue</span><span class="ch">Wed</span><span class="ch">Thu</span><span class="ch">Fri</span><span class="ch">Sat</span><span class="ch">Sun</span>${cells.join("")}</div></div>
  ${panel}
  <div class="col" style="gap:10px"><b style="font-family:Sora,sans-serif;font-size:17px">Coming up</b>${S.pjobs.filter(j=>j.status==="paid"&&j.date>=11).sort((a,b)=>a.date-b.date).map(j=>{const e=ex(j.eid);return `<button class="pc" data-preq="${j.id}" style="flex-direction:row;align-items:center;gap:12px;padding:12px 14px"><span style="width:44px;text-align:center"><b style="font-family:Sora,sans-serif;font-size:18px;display:block">${j.date}</b><span class="muted" style="font-size:11px">Oct</span></span><span style="flex:1;text-align:left"><b style="font-size:15px">${esc(j.title)}</b><span class="muted" style="display:block;font-size:13px">${e.name}  ·  ${j.slot}</span></span><b style="font-family:Sora,sans-serif;color:var(--green)">${money(pq(j).net)}</b></button>`}).join("")}</div>`;
}
/* scripted customer behaviour */
const EXREPLY={...{},ES:["¡Perfecto, acepto! Hasta el martes.","Perfect, I accept. See you Tuesday."],DE:["Passt, ich nehme das Angebot an. Danke!","That works, I accept the quote. Thanks!"],LT:["Puiku, sutinku. Iki!","Great, I accept. See you!"],JA:["ありがとうございます。お願いします。","Thank you, please go ahead."]};
const EXCHAT=[["Thanks, see you then!","(original)"],["Could you bring a spare cartridge just in case?","(original)"],["Perfect, the door code is 2210.","(original)"]];
function customerActs(eid){const c=S.pchats[eid];const e=ex(eid);const j=S.pjobs.find(x=>x.eid===eid&&x.status==="quoted");c.typing=true;save();if(route==="pchat"&&S.pview===eid)render();
  setTimeout(()=>{c.typing=false;if(j){j.status="paid";j.paidAt="just now";const [o,t]=EXREPLY[e.lang]||EXREPLIES_EXTRA[e.lang]||EXCHAT[0];c.msgs.push({text:t,orig:o,when:"now"});c.msgs.push({sys:true,text:`${e.name.split(" ")[0]} paid ${money(pq(j).gross)} into escrow · address shared`})}else{const [t,o]=EXCHAT[c.msgs.length%EXCHAT.length];c.msgs.push({text:t,orig:o,when:"now"})}
   c.t=Date.now();if(!(route==="pchat"&&S.pview===eid))c.unread=(c.unread||0)+1;save();render();if(j)toast(`${e.name.split(" ")[0]} accepted and paid`)},2200)}

document.addEventListener("click",e=>{
  const cal=e.target.closest("[data-cal]");if(cal){S.calDay=S.calDay===+cal.dataset.cal?null:+cal.dataset.cal;S.calJob=null;save();render();return}
  const cj=e.target.closest("[data-caljob]");if(cj){S.calJob=S.calJob===cj.dataset.caljob?null:cj.dataset.caljob;save();render();return}
  const t=e.target.closest("[data-preq],[data-pchat],[data-ptab],[data-slot],[data-pricing],[data-act]");if(!t)return;const d=t.dataset;
  if(d.preq){S.preqId=d.preq;save();go("preq");return}
  if(d.pchat){pensure();S.pview=d.pchat;save();go("pchat");return}
  if(d.ptab){S.ptab=d.ptab;save();render();return}
  if(d.slot&&d.t){const a=S.avail[d.slot];S.avail[d.slot]=a.includes(d.t)?a.filter(x=>x!==d.t):[...a,d.t].sort();save();render();return}
  if(d.pricing){S.pricing=d.pricing;save();render();return}
  const a=d.act;
  if(a==="pnewreq"){pensure();const pool=(REQ_BY_CAT[pTrade()]||REQ_BY_CAT.Plumbing).concat(EXTRA_REQ.map(x=>[x[0],x[1],x[2],x[3],x[5]]));const r=pool[Math.floor(Math.random()*pool.length)];const e=EXPATS[Math.floor(Math.random()*EXPATS.length)];const date=12+Math.floor(Math.random()*18);const day=["Thu","Fri","Sat","Sun","Mon","Tue","Wed"][(date-1)%7];const id="g"+Date.now();
    S.pjobs.unshift({id,eid:e.id,title:r[0],desc:r[1],photos:r[2],day,slot:["09:00","11:00","14:00","16:00"][Math.floor(Math.random()*4)],date,status:"new",hours:1.5,materials:0,matDesc:"",ago:"just now"});
    if(!S.pchats[e.id])S.pchats[e.id]={eid:e.id,t:Date.now(),unread:0,msgs:[{sys:true,text:`Chat with ${e.name.split(" ")[0]} started · translated automatically`}]};const c=S.pchats[e.id];c.msgs.push({text:`Hi ${pFirst()}, ${r[0].toLowerCase()}. ${r[1]} Could you come ${day} ${date} at ${S.pjobs[0].slot}?`,orig:`(${LNAME[e.lang]} original)`,when:"now",req:id});c.unread=(c.unread||0)+1;c.t=Date.now();save();render();toast(`New request from ${e.name.split(" ")[0]}`);return}
  if(a==="pverify"){S.verified=true;save();render();toast("Verified ID and Licensed badges are live");return}
  if(a==="togOnline"){S.online=S.online===false?true:false;save();render();return}
  if(a==="pdecline"){const j=S.pjobs.find(x=>x.id===S.preqId);j.status="declined";save();goBack();toast("Request declined");return}
  if(a==="pwithdraw"){const j=S.pjobs.find(x=>x.id===S.preqId);j.status="new";save();render();toast("Quote withdrawn");return}
  if(a==="pdone"){const j=S.pjobs.find(x=>x.id===S.preqId);j.status="done";save();render();toast("Marked as done, customer asked to confirm");return}
  if(a==="pconfirm"){const j=S.pjobs.find(x=>x.id===S.preqId);j.status="released";save();render();toast(money(pq(j).net)+" released to your payout");return}
  if(a==="pcancel"){const j=S.pjobs.find(x=>x.id===S.preqId);if(confirm("Cancel this booking? The customer is refunded in full and your reliability score drops.")){j.status="cancelled";save();render()}return}
  if(a==="pswitch"){S.view="p1";save();go("profile");return}
});
document.addEventListener("submit",e=>{
  const f=e.target;const k=f.dataset.form;if(!["quote","pmsg","prate"].includes(k))return;e.preventDefault();pensure();
  if(k==="quote"){const j=S.pjobs.find(x=>x.id===S.preqId);if(f.hours)j.hours=+f.hours.value||1;j.materials=+f.materials.value||0;j.matDesc=f.matDesc.value.trim()||pMat()[0];j.note=f.note.value.trim();j.status="quoted";
    const c=S.pchats[j.eid];if(j.note)c.msgs.push({me:true,text:j.note,orig:"",when:"now"});c.msgs.push({quote:j.id,when:"now"});c.t=Date.now();save();render();toast("Quote sent and translated");customerActs(j.eid);return}
  if(k==="pmsg"){const v=f.msg.value.trim();if(!v)return;const c=S.pchats[S.pview];c.msgs.push({me:true,text:v,orig:"",when:"now"});c.t=Date.now();save();render();customerActs(S.pview);return}
  if(k==="prate"){const v=+f.price.value;if(!(v>=10&&v<=2000)){toast("Enter a price between €10 and €2000","err");return}if(S.pricing==="hour")S.rate=String(v);else S.jobPrice=v;save();render();toast("Saved");return}
});
/* entry points */
SCREENS.pdone=((orig)=>()=>orig().replace('data-act="soon">Set my availability','data-act="pstart">Set my availability').replace('data-act="soon">Preview my profile','data-act="pswitch">Preview my profile'))(SCREENS.pdone);
document.addEventListener("click",e=>{const t=e.target.closest('[data-act="pstart"]');if(!t)return;pensure();S.ptab="Availability";history=[];go("pjobs")});
if(S.loggedIn&&S.role==="provider"){route="phome";render()}

</script>
