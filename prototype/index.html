<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodu prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--mint:#BFE3D6;--ink:#16201D;--terra:#D9643A;--green:#0E5A4C;--ivory:#F6F2EA;--muted:#56605C;--line:#D8D2C6;--white:#FFFFFF;--body:#3B4541;--yellow:#F2C14E;--err:#C2451C;--ground:#E9E4DA}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);font-family:'DM Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#phone{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:390px;height:844px;max-width:100%;background:var(--ivory);border-radius:44px;border:1px solid var(--line);overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(22,32,29,.18)}
@media (max-width:430px){#stage{padding:0}#phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 20px 0;gap:18px;overflow-y:auto;scrollbar-width:none;animation:in .28s ease-out}
.screen>*{flex-shrink:0}
.screen::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.screen.back{animation-name:inb}
.screen.still{animation:none}
@keyframes inb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-family:'Sora',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1{font-size:30px}h2{font-size:28px}
p{margin:0;line-height:1.5}
.sub{font-size:15px;color:var(--body)}
.muted{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:12px 0 28px}
.center{text-align:center}
button{font-family:'DM Sans',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}*:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn{height:56px;width:100%;border-radius:28px;border:none;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px}
.btn.p{background:var(--green);color:#fff}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.g{background:var(--mint);color:var(--ink)}
.btn.a{background:var(--terra);color:#fff}
.btn:disabled{background:#E4DED3;color:#9AA29E;border:none;cursor:default}
.btn.sm{height:44px;font-size:15px;width:auto}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.social{height:52px;flex:1;border:1px solid var(--line);border-radius:26px;background:#fff;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f span.l{font-size:13px;font-weight:700;color:var(--muted)}
.in{height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px}
.in input,.in select,.ta,.otp input{user-select:text;-webkit-user-select:text}
.in input,.in select{flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.in input::placeholder{color:#9AA29E}
.in:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,90,76,.12)}
.in.err{border-color:var(--terra)}
.errt{font-size:13px;color:var(--err);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--body);cursor:pointer}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.chk input:checked+.box{background:var(--green);border-color:var(--green)}
.chk input:focus-visible+.box{box-shadow:0 0 0 3px rgba(14,90,76,.25)}
.chk .box svg{opacity:0}.chk input:checked+.box svg{opacity:1}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.role{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);cursor:pointer;width:100%;text-align:left;font:inherit}
.role.on{border-color:var(--green)}
.role .ic{width:52px;height:52px;border-radius:16px;background:var(--ivory);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.role.on .ic{background:var(--mint)}
.role b{font-family:'Sora',sans-serif;font-size:17px;display:block}
.role small{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.radio{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--line);background:#fff;flex-shrink:0}
.on>.radio,.radio.on{border:6px solid var(--green)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--mint);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:var(--body)}
.prog{flex:1;display:flex;gap:4px;margin:0 16px}.prog span{flex:1;height:4px;border-radius:2px;background:#E4DED3}.prog span.on{background:var(--green)}
.otp{display:flex;gap:10px}.otp input{width:48px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-family:'Sora',sans-serif;font-weight:700;font-size:22px;outline:none;color:var(--ink)}
.otp input:focus{border-color:var(--green)}.otp input.filled{border-color:var(--green)}
.lang{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.lang.on{border-color:var(--green)}
.lang .hd{display:flex;align-items:center;gap:10px;cursor:pointer;width:100%;background:none;border:none;padding:0;font:inherit;text-align:left}
.lang .code{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;width:32px}
.lang .nm{flex:1;font-size:15px}
.lvls{display:flex;gap:4px}.lvls button{height:28px;padding:0 9px;border-radius:14px;font-size:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--line)}
.lvls button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{width:52px;height:32px;border-radius:16px;background:#D8D2C6;position:relative;border:none;flex-shrink:0;padding:0}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on:after{left:23px}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;width:100%;font:inherit;text-align:left;cursor:pointer}
.pm.on{border-color:var(--green)}
.pm .tag{width:44px;height:30px;border-radius:7px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pm b{display:block;font-size:15px}.pm small{font-size:13px;color:var(--muted)}
.photo{width:92px;height:92px;border-radius:14px;border:1.5px dashed var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font:inherit}
.photo.done{border:none;background:linear-gradient(135deg,#9CC9B8,#5E8F80);color:#fff;font-weight:700}
.pill{display:inline-flex;align-items:center;white-space:nowrap;flex-shrink:0;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700}
.pill.ok{background:var(--green);color:#fff}.pill.rev{background:var(--yellow);color:var(--ink)}
.link{color:var(--green);font-weight:700;background:none;border:none;padding:0;font:inherit;font-weight:700;cursor:pointer}
.greet{position:relative;height:300px;border-radius:28px;background:var(--mint);display:flex;align-items:center;justify-content:center}
.bub{position:absolute;padding:8px 14px;background:#fff;border-radius:16px 16px 16px 4px;font-size:14px;font-weight:500}
.toast{pointer-events:none;position:absolute;left:20px;right:20px;top:auto;bottom:104px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;animation:in .2s;z-index:5}
.toast.err{background:var(--terra)}
.rolesw{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;background:rgba(22,32,29,.08);border-radius:14px;padding:2px;gap:2px}.rolesw button{height:22px;padding:0 10px;border-radius:12px;border:none;background:transparent;font:inherit;font-size:11px;font-weight:700;color:var(--muted)}.rolesw button.on{background:var(--ink);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.devbar{position:fixed;left:12px;bottom:12px;background:rgba(22,32,29,.85);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;display:flex;gap:10px;align-items:center;z-index:9}
.devbar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:3px 10px;font-size:12px}
@media (max-width:430px){.devbar{display:none}}

.lc{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:13px;white-space:nowrap}.lc span{color:var(--muted)}.lc.on{background:var(--mint);border-color:var(--mint)}
.bd{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap}
.pc{display:flex;flex-direction:column;gap:12px;align-items:flex-start;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;font:inherit;color:var(--ink);text-align:left}
.bnav{position:sticky;bottom:0;margin:auto -20px 0;width:calc(100% + 40px);z-index:4;display:flex;height:84px;border-top:1px solid var(--line);background:#fff;padding-bottom:18px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;background:none;border:none;font:inherit;font-size:12px;color:var(--muted)}
.bnav button.on{color:var(--ink);font-weight:700}.pil{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative}.bnav .on .pil{background:var(--mint)}
.nb{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.pil .nb{position:absolute;top:-4px;right:2px}
.cat{height:92px;border-radius:18px;border:none;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink)}
.jobcard{width:100%;background:var(--ink);border:none;border-radius:20px;padding:16px;color:#fff;text-align:left;font:inherit}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0}.stat b{font-family:Sora,sans-serif;font-size:19px}.stat small{font-size:12px;color:var(--muted)}
.day{width:44px;height:60px;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid var(--line);font:inherit;color:var(--ink)}.day small{font-size:11px;opacity:.75}.day b{font-size:17px}.day.off{color:#A9AFAB;background:transparent;border-color:transparent}.day.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot{height:40px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font:inherit;font-size:14px;font-weight:600;color:var(--ink)}.slot.sel{background:var(--green);border-color:var(--green);color:#fff}
.cta{position:sticky;bottom:0;margin:auto -20px 0;width:calc(100% + 40px);z-index:4;padding:12px 20px 28px;background:var(--ivory);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.ta{min-height:96px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:12px 16px;font:inherit;font-size:16px;color:var(--ink);resize:vertical;outline:none}.ta:focus{border-color:var(--green)}
.sheetbg{position:absolute;inset:0;background:rgba(22,32,29,.4)}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}.eic{width:72px;height:72px;border-radius:36px;background:var(--mint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.qcard{width:82%;background:#fff;border:1.5px solid var(--green);border-radius:18px 18px 18px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bub2{max-width:80%;background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4}.bub2.me{background:var(--green);color:#fff;border:none;border-radius:18px 18px 4px 18px}.orig{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:flex-start}.me .orig{color:rgba(255,255,255,.72)}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
.starb{font-size:40px;line-height:1;background:none;border:none;color:#D8D2C6;padding:0}.starb.on{color:var(--yellow)}
.pill.dark{background:var(--ink);color:#fff}.pill.gray{background:#E9E4DA;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--green)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ch{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cc{position:relative;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;background:#fff;border:1px solid #EDE8DF;font-family:inherit;color:var(--ink);padding:0}.cc:disabled{color:#A9AFAB;cursor:default}.cc.sel{background:var(--ink)!important;color:#fff;border-color:var(--ink)}.cc.empty{background:transparent;border:none}.cc.has{cursor:pointer;border-color:var(--line)}.cc.has:hover,.cc.pin{background:var(--mint);border-color:var(--mint)}.cc.today b{color:var(--terra)}
.dots2{display:flex;gap:2px;height:5px}.dots2 i{width:5px;height:5px;border-radius:3px;display:block}.lg{width:8px;height:8px;border-radius:4px;display:inline-block}
.pop{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(22,32,29,.16);z-index:20;text-align:left;cursor:default}.cc:nth-child(7n+1) .pop,.cc:nth-child(7n+2) .pop{left:0;transform:none}.cc:nth-child(7n) .pop,.cc:nth-child(7n-1) .pop{left:auto;right:0;transform:none}
.cc.has:hover .pop,.cc.pin .pop,.cc.has:focus-within .pop{display:block}
.prow{position:relative;padding:6px;border-radius:10px;cursor:pointer}.prow:hover,.prow.pin,.prow:focus{background:var(--ivory)}.dotc{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.tip{display:none;position:absolute;left:100%;top:0;margin-left:8px;width:240px;background:var(--ink);color:#fff;border-radius:14px;padding:12px;box-shadow:0 12px 30px rgba(22,32,29,.25);z-index:30;cursor:default}.tip .muted{color:rgba(255,255,255,.7)}.tip .chip{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}.tip b{color:#fff}
.prow:hover .tip,.prow.pin .tip,.prow:focus .tip{display:block}
@media (max-width:520px){.tip{left:0;top:100%;margin:6px 0 0}}

.hwrap{position:relative;margin:0 -20px}.hwrap .hscroll{margin:0;padding:2px 20px 6px;scroll-snap-type:x proximity}.hwrap .mini{scroll-snap-align:start}
.harr{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(22,32,29,.14);display:flex;align-items:center;justify-content:center;z-index:3;padding:0}.harr.prev{left:8px}.harr.next{right:8px}.hwrap.atstart .prev,.hwrap.atend .next,.hwrap.noscroll .harr{display:none}
.hwrap::before,.hwrap::after{content:"";position:absolute;top:0;bottom:6px;width:28px;pointer-events:none;z-index:2}.hwrap::before{left:0;background:linear-gradient(90deg,var(--ivory),transparent)}.hwrap::after{right:0;background:linear-gradient(270deg,var(--ivory),transparent)}.hwrap.atstart::before,.hwrap.atend::after{display:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.mini{flex-shrink:0;width:118px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:var(--ink);text-align:center}.mini b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hero{width:100%;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;font:inherit;color:var(--ink);text-align:left}

.greet.wl{height:214px;background:linear-gradient(160deg,#CDEBE0,#BFE3D6 55%,#B2DDCD);overflow:hidden}
.greet.wl .bub{animation:floaty 4s ease-in-out infinite;box-shadow:0 6px 16px rgba(22,32,29,.08)}
.f1{animation-delay:0s}.f2{animation-delay:.6s}.f3{animation-delay:1.2s}.f4{animation-delay:1.8s}.f5{animation-delay:2.4s;font-size:13px;padding:6px 12px}.f6{animation-delay:3s;font-size:13px;padding:6px 12px}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.greet.wl svg{filter:drop-shadow(0 10px 20px rgba(22,32,29,.18))}
.greet.wl .kd{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .3s forwards}
.greet.wl .dt{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.5,1) 1.3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{transform:scale(1)}}
.facepile{display:inline-flex;align-items:center;height:32px;background:var(--mint);border-radius:16px;padding:0 12px 0 3px;white-space:nowrap}
.fp{width:24px;height:24px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:10px;border:2px solid #fff;margin-right:-8px}.fpt{margin-left:14px;font-size:12px;font-weight:700}
.rot{display:inline-grid;justify-items:start;color:var(--green)}.rot span{white-space:nowrap}.rot span{grid-area:1/1;animation:rotw 10s infinite;opacity:0}.rot span:nth-child(1){animation-delay:0s}.rot span:nth-child(2){animation-delay:2s}.rot span:nth-child(3){animation-delay:4s}.rot span:nth-child(4){animation-delay:6s}.rot span:nth-child(5){animation-delay:8s}
@keyframes rotw{0%{opacity:0;transform:translateY(8px)}4%,18%{opacity:1;transform:none}22%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.greet.wl .bub,.rot span,.greet.wl .kd,.greet.wl .dt{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}.rot span:not(:first-child){display:none}}

/* desktop layout */
@media (min-width:900px){
 body:not(.phone-mode) #stage{padding:0;display:block}
 body:not(.phone-mode) #phone{width:100%;max-width:none;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}

</div>

function render(){
  const ph=document.getElementById("phone");
  const old=ph.querySelector(".screen");const top=old?old.scrollTop:0;if(old)old.remove();ph.insertAdjacentHTML("beforeend",`<div class="screen ${anim?(dir==="back"?"back":"fwd"):"still"}" id="scr">${SCREENS[route]()}</div>`);if(!anim)ph.querySelector(".screen").scrollTop=top;anim=false;
  ph.classList.toggle("withnav",!!ph.querySelector(".bnav"));let ck=null;try{ck=localStorage.getItem("kodu.cookie")}catch(e){}const cb=ph.querySelector(".cookie");if(!ck&&!cb&&route!=="legal"){ph.insertAdjacentHTML("beforeend",`<div class="cookie" role="dialog" aria-label="Cookie choice"><span><b>Cookies on Kodu.</b> We use necessary cookies to keep you logged in, and analytics only if you agree. <button class="link" data-legal="cookies">Cookie Policy</button></span><div class="row" style="gap:8px"><button class="btn s" style="flex:1;border-color:#fff;color:#fff" data-cookie="no">Only necessary</button><button class="btn" style="flex:1;background:var(--mint);color:var(--ink)" data-cookie="yes">Accept all</button></div></div>`)}else if((ck||route==="legal")&&cb)cb.remove();ph.classList.toggle("landing",route==="welcome");ph.classList.toggle("chatview",route==="chat"||route==="pchat");ph.classList.toggle("legalview",route==="legal");const mm=ph.querySelector(".msgs");if(mm)mm.scrollTop=mm.scrollHeight;document.querySelectorAll("[data-switch]").forEach(b=>b.classList.toggle("on",S.loggedIn&&S.role===b.dataset.switch));document.getElementById("rolesw").style.display=S.loggedIn?"flex":"none";
  const first=ph.querySelector(".in.err input, .otp input");if(first&&route==="otp")first.focus();
  if(route==="otp")countdown();
}
let cdT;function countdown(){clearInterval(cdT);let n=30;cdT=setInterval(()=>{n--;const el=document.getElementById("cd");if(!el){clearInterval(cdT);return}el.textContent="0:"+String(Math.max(n,0)).padStart(2,"0");if(n<=0){el.parentElement.innerHTML='<button class="link" data-act="resend">Resend code</button>';clearInterval(cdT)}},1000)}

<div class="col"><span class="muted" style="font-weight:700">Trust</span><label class="chk"><input type="checkbox" data-f="verified" ${f.verified?"checked":""}><span class="box">${ico("check","#fff",16)}</span><span>Verified ID only</span></label><label class="chk"><input type="checkbox" data-f="lic" ${f.lic?"checked":""}><span class="box">${ico("check","#fff",16)}</span><span>Licensed only (plumbing and electrical)</span></label><label class="chk"><input type="checkbox" data-f="fast" ${f.fast?"checked":""}><span class="box">${ico("check","#fff",16)}</span><span>Replies within 30 minutes</span></label></div>
<div class="col"><span class="muted" style="font-weight:700">Availability</span><div class="row wrap">${["Today","This week","Weekends"].map(a=>`<button class="chip ${f.avail===a?"on":""}" data-fv="avail" data-val="${a}">${a}</button>`).join("")}</div></div>
<div class="col"><div class="row between"><span class="muted" style="font-weight:700">Date</span>${f.day?`<button class="link" style="font-size:13px" data-fv="day" data-val="">Any day</button>`:`<span class="muted">Any day</span>`}</div><div class="row" style="gap:6px">${DAYS.map(([d,n])=>`<button class="day ${f.day===d?"sel":""}" data-fv="day" data-val="${f.day===d?"":d}"><small>${d}</small><b>${n}</b></button>`).join("")}</div></div>
<div class="col"><span class="muted" style="font-weight:700">Time of day</span><div class="row wrap">${[["","Any time"],["Morning","Morning, before 12"],["Afternoon","Afternoon, 12 to 16"],["Evening","Evening, after 16"]].map(([v,l])=>`<button class="chip ${f.time===v?"on":""}" data-fv="time" data-val="${v}">${l}</button>`).join("")}</div>${f.day||f.time?`<p class="muted">Showing providers with a free slot ${f.day?"on "+f.day:""} ${f.time?"in the "+f.time.toLowerCase():""}. Pick the exact slot on their profile.</p>`:""}</div>
<div class="col"><span class="muted" style="font-weight:700">Minimum rating</span><div class="row wrap">${[[0,"Any"],[4.5,"4.5 and up"],[4.8,"4.8 and up"],[5,"5.0 only"]].map(([v,l])=>`<button class="chip ${f.minR===v?"on":""}" data-fvn="minR" data-val="${v}">${l}</button>`).join("")}</div></div>
<div class="col" style="${f.pricing==="job"?"display:none":""}"><div class="row between"><span class="muted" style="font-weight:700">Hourly rate</span><b style="font-size:13px">up to €${f.max}</b></div><input type="range" min="20" max="60" step="5" value="${f.max}" data-range="max" aria-label="Maximum hourly rate"><div class="row between muted" style="font-size:12px"><span>€20</span><span>€60</span></div></div>
<div class="col"><span class="muted" style="font-weight:700">Sort by</span>${["Best match","Highest rated","Lowest price","Nearest"].map(o=>`<button class="row" style="gap:10px;background:none;border:none;padding:6px 0;font:inherit;font-size:15px" data-fv="sort" data-val="${o}"><span class="radio ${f.sort===o?"on":""}"></span>${o}${o==="Best match"?" for my languages":""}</button>`).join("")}</div>
<div class="row" style="gap:10px;margin-top:4px"><button class="btn s" style="width:120px;height:52px" data-act="resetF">Reset</button><button class="btn p" style="height:52px;font-size:15px" data-go="back">Show ${results().length} providers</button></div></div>`},

profile:()=>{const p=find(S.view);const saved=S.saved.includes(p.id);return `<div class="row between" style="height:44px"><button class="ib" data-go="back" aria-label="Back">${ico("back")}</button><div class="row" style="gap:8px"><button class="ib" data-report="profile" aria-label="Report this profile">${ico("flag","#16201D",18)}</button><button class="ib" data-act="share" aria-label="Share">${ico("send","#16201D",20)}</button><button class="ib" data-save="${p.id}" aria-label="${saved?"Remove from saved":"Save"}" aria-pressed="${saved}" style="${saved?"background:var(--mint);border-color:var(--mint)":""}">${ico("star","#16201D",20)}</button></div></div>
<div class="col center" style="align-items:center;gap:10px">${av(p,88)}<div><div class="row" style="justify-content:center;gap:6px"><span style="font-family:Sora,sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em">${p.name}</span>${ico("shield","#0E5A4C",20)}</div><div class="sub" style="color:var(--muted)">${p.trade}  ·  ${p.area}, Tallinn</div></div><div class="row wrap" style="justify-content:center;gap:6px">${p.badges.map(badge).join("")}</div></div>
<div class="card row" style="padding:0">${[[p.rating.toFixed(1),p.reviews+" reviews"],[p.rel+"%","on time"],[p.reply,"reply time"],[p.pricing==="job"?"€"+p.jobPrice:"€"+p.rate,p.pricing==="job"?"per job":"per hour"]].map(([v,l],i)=>`<span class="stat" style="${i?"border-left:1px solid #EDE8DF":""}"><b>${v}</b><small>${l}</small></span>`).join("")}</div>
<div class="col"><div class="row between" style="align-items:baseline"><b style="font-family:Sora,sans-serif;font-size:17px">Languages</b><span class="muted">Chat translates to ${LNAME[myLang()]}</span></div><div class="row wrap" style="gap:6px">${p.langs.map(lchip).join("")}</div><div class="note">${ico("globe","#16201D",16)}<span>${speaks(p)?`${p.name.split(" ")[0]} speaks ${LNAME[speaks(p)[0]]} at ${speaks(p)[1]}. You can write in ${LNAME[myLang()]} and Kodu translates both ways.`:`${p.name.split(" ")[0]} does not speak ${LNAME[myLang()]}. Kodu translates every message both ways, and shows the original under each one.`}</span></div></div>
<div class="col"><b style="font-family:Sora,sans-serif;font-size:17px">About</b><p class="sub">${p.bio}</p><div class="row wrap" style="gap:6px">${p.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div></div>
<div class="col" style="gap:10px"><div class="row between" style="align-items:baseline"><b style="font-family:Sora,sans-serif;font-size:17px">Reviews from expats</b><span class="muted">${p.reviews} total</span></div>${p.revs.map(([n,l,t,r,w])=>`<div class="card col" style="gap:8px;padding:14px"><div class="row" style="gap:10px"><span style="width:36px;height:36px;border-radius:18px;background:var(--mint);display:inline-flex;align-items:center;justify-content:center;font-weight:700">${n[0]}</span><span style="flex:1"><b style="font-size:15px">${n}</b> <span class="muted">· expat, ${l}</span><span class="muted" style="display:block;font-size:12px">${w}</span></span>${stars(r)}</div><p class="sub" style="font-size:14px">${t}</p></div>`).join("")}</div>
<div class="col" style="gap:10px"><b style="font-family:Sora,sans-serif;font-size:17px">Next available</b><div class="row" style="gap:6px">${DAYS.map(([d,n])=>`<span class="day ${p.slots[d]?"":"off"}"><small>${d}</small><b>${n}</b></span>`).join("")}</div><div class="row wrap" style="gap:8px">${Object.entries(p.slots).slice(0,2).flatMap(([d,ss])=>ss.map(s=>`<button class="slot" data-book="${p.id}" data-day="${d}" data-slot="${s}">${d} ${s}</button>`)).join("")}</div></div>
<div class="col"><b style="font-family:Sora,sans-serif;font-size:17px">Why you can trust ${p.name.split(" ")[0]}</b><div class="card" style="padding:4px 14px">${[["shield","Identity checked","Document verified by our partner"],["check",p.badges.includes("Licensed")?"Licence on file":"Trade experience declared","Shown on request"],["lock","Escrow on every job","Pay only when you confirm the work"]].map(([i,t,s])=>`<div class="row" style="gap:12px;padding:10px 0;border-bottom:1px solid #EDE8DF"><span class="eic" style="width:36px;height:36px;border-radius:11px">${ico(i,"#16201D",18)}</span><span><b style="font-size:15px">${t}</b><span class="muted" style="display:block">${s}</span></span></div>`).join("")}</div></div>

<div style="height:12px"></div><div class="cta"><span style="width:78px"><b style="font-family:Sora,sans-serif;font-size:20px">€${p.pricing==="job"?p.jobPrice:p.rate}<span class="muted" style="font-size:13px;font-weight:500">${p.pricing==="job"?" per job":"/h"}</span></b><span class="muted" style="display:block;font-size:12px">quote before work</span></span><button class="btn g" style="width:100px;height:52px;font-size:15px" data-chat="${p.id}">Message</button><button class="btn p" style="flex:1;height:52px;font-size:15px;white-space:nowrap" data-book="${p.id}">Request quote</button></div>`},

book:()=>{const p=find(S.view);const d=S.draft;return `${bar(1,3)}${head("Describe the job",`${p.name.split(" ")[0]} replies with a written quote before any work starts.`)}
<form data-form="book" class="col" style="gap:14px">
<label class="f"><span class="l">What needs doing</span><div class="in ${err.title?"err":""}"><input name="title" placeholder="Leaking kitchen tap" value="${esc(d.title||"")}"></div>${err.title?`<span class="errt">${err.title}</span>`:""}</label>
<label class="f"><span class="l">Details</span><textarea name="desc" class="ta" placeholder="When it started, where it is, anything you have tried. Write in ${LNAME[myLang()]}, ${p.name.split(" ")[0]} reads it in ${LNAME[native(p)]}.">${esc(d.desc||"")}</textarea></label>
<div class="col"><span class="muted" style="font-weight:700">Photos</span><div class="row">${["Photo 1","Photo 2"].map(k=>`<button type="button" class="photo ${d[k]?"done":""}" data-dphoto="${k}">${d[k]?ico("check","#fff",22):ico("plus","#56605C",20)}${d[k]?"Added":"Add photo"}</button>`).join("")}</div></div>
<div class="col"><span class="muted" style="font-weight:700">Urgency</span>${chips("urgency",["Flexible","This week","Urgent"],S.urgency||"This week")}</div>
${S.landlord&&S.llName?`<div class="note">${ico("shield","#16201D",16)}<span>The quote is also sent to ${esc(S.llName)} for approval, since your landlord arranges repairs.</span></div>`:""}
<div class="note">${ico("pin","#16201D",16)}<span>${p.name.split(" ")[0]} sees your district (${((S.address||"Kesklinn").split(",")[1]||"Kesklinn").trim()}) now and the full address once you pay.</span></div>
<div class="foot"><button class="btn p" type="submit">Choose a time</button></div></form>`},

slots:()=>{const p=find(S.view);const d=S.draft;const day=d.day||Object.keys(p.slots)[0];return `${bar(2,3)}${head("Pick a time",`${p.name.split(" ")[0]}'s free slots this week. Jobs usually take one to two hours.`)}
<div class="row" style="gap:6px">${DAYS.map(([dd,n])=>`<button class="day ${p.slots[dd]?"":"off"} ${day===dd?"sel":""}" data-day="${dd}" ${p.slots[dd]?"":"disabled"}><small>${dd}</small><b>${n}</b></button>`).join("")}</div>
<div class="row wrap" style="gap:8px">${(p.slots[day]||[]).map(s=>`<button class="slot ${d.day===day&&d.slot===s?"sel":""}" data-pick="${s}">${s}</button>`).join("")}</div>
${err.slot?`<span class="errt">${err.slot}</span>`:""}
<div class="card col" style="gap:4px"><span class="muted" style="font-weight:700">Estimate</span><div class="row between"><span>${p.pricing==="job"?"Fixed price per job":"1.5 h × €"+p.rate}</span><b>€${(p.pricing==="job"?p.jobPrice:1.5*p.rate).toFixed(2)}</b></div><p class="muted">Final price comes in ${p.name.split(" ")[0]}'s quote. Materials and the 10% Kodu fee are shown before you pay.</p></div>
<div class="foot"><button class="btn p" data-act="sendRequest">Send request</button></div>`},

job:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);const q=quote(j);return `${bar()}<div class="row between"><h2>${esc(j.title)}</h2>${pill(j.status)}</div>
<div class="card row" style="gap:12px">${av(p,44)}<span style="flex:1"><b>${p.name}</b><span class="muted" style="display:block">${p.trade}  ·  ${j.day} ${j.slot}</span></span><button class="btn g sm" style="height:40px" data-chat="${p.id}">Chat</button></div>
${j.status==="requested"?`<div class="note">${ico("globe","#16201D",16)}<span>Request sent and translated to ${LNAME[native(p)]}. ${p.name.split(" ")[0]} usually replies in ~${p.reply}. Prototype: open the chat to receive the quote.</span></div>`:""}
${j.status!=="requested"?`<div class="card col" style="gap:0;padding:6px 16px">${[[p.pricing==="job"?"Fixed price for the job":"Labour  "+j.hours+" h × €"+p.rate,money(q.labour)],["Materials  "+j.matDesc,money(j.materials)],["Kodu service fee 10%",money(q.fee)]].map(([a,b])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid #EDE8DF;font-size:15px"><span>${a}</span><b style="font-family:Sora,sans-serif">${b}</b></div>`).join("")}<div class="row between" style="padding:12px 0;font-size:17px;color:var(--green)"><b>${j.status==="paid"||j.status==="done"?"Held in escrow":"Total to hold in escrow"}</b><b style="font-family:Sora,sans-serif">${money(q.total)}</b></div></div>`:""}
${j.status==="paid"?`<div class="note">${ico("lock","#16201D",16)}<span>Paid ${j.paidAt}. Released to ${p.name.split(" ")[0]} when you confirm the job is done, or automatically 72 h after the visit.</span></div>`:""}
${j.status==="done"?`<div class="note">${ico("check","#16201D",16)}<span>Completed. ${money(q.total-(j.refund||0))} released to ${p.name.split(" ")[0]}${j.refund?" after the partial refund":""}. Receipt KD 2026 ${j.id.slice(-4)} is in your email.</span></div>`:""}
<div class="col"><b style="font-family:Sora,sans-serif;font-size:17px">Details</b><p class="sub">${esc(j.desc||"No extra details.")}</p><div class="row wrap"><span class="chip">${j.urgency}</span>${j.photos?`<span class="chip">${j.photos} photos</span>`:""}</div></div>
${j.status==="quoted"&&j.ll?`<div class="note" style="${j.ll==="pending"?"background:#FBEFD0":""}">${ico("shield","#16201D",16)}<span>${j.ll==="pending"?`Quote sent to ${esc(S.llName)} for approval. You can pay once they approve.`:`Approved by ${esc(S.llName)}. You can pay now.`}</span></div>`:""}
${j.status==="disputed"?`<div class="note" style="background:#F9DED3">${ico("lock","#16201D",16)}<span><b>Payment on hold.</b> ${p.name.split(" ")[0]} has 48 h to respond, then Kodu proposes a resolution. Reason: ${esc(j.dispute||"")}.</span></div><div class="card col" style="gap:8px"><span class="muted" style="font-weight:700">Prototype: resolve the dispute</span><div class="row" style="gap:8px"><button class="btn g sm" style="flex:1;padding:0 8px;font-size:14px" data-resolve="partial">Refund half</button><button class="btn g sm" style="flex:1;padding:0 8px;font-size:14px" data-resolve="full">Refund all</button><button class="btn g sm" style="flex:1;padding:0 8px;font-size:14px" data-resolve="release">Release</button></div></div>`:""}
${j.refund?`<div class="note">${ico("check","#16201D",16)}<span>${money(j.refund)} refunded to your card. It arrives within 5 working days.</span></div>`:""}
<div class="foot">${j.status==="quoted"?`<button class="btn a" data-go="pay" ${j.ll==="pending"?"disabled":""}>${ico("lock","#fff",20)}Pay ${money(q.total)} securely</button><button class="btn s" data-act="declineQuote">Decline quote</button>`:j.status==="paid"?`<button class="btn p" data-act="confirmDone">Confirm job is done</button><div class="row" style="gap:10px"><button class="btn s" style="flex:1" data-go="dispute">Report a problem</button><button class="btn s" style="flex:1" data-act="cancel">Cancel booking</button></div>`:j.status==="done"?(j.rated?`<button class="btn p" data-rebook="${p.id}">Book ${p.name.split(" ")[0]} again</button><p class="center muted">Thanks for your review.</p>`:`<button class="btn p" data-go="rate">Rate ${p.name.split(" ")[0]}</button><button class="btn s" data-rebook="${p.id}">Book again</button>`):j.status==="refunded"?`<button class="btn s" data-cat="${p.cat}">Find another ${p.trade.toLowerCase()}</button>`:j.status==="requested"?`<button class="btn s" data-act="cancel">Cancel request</button>`:""}</div>`},

dispute:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);S.dsp=S.dsp||{};return `${bar()}${head("Report a problem","Your payment stays on hold while Kodu looks into it. "+p.name.split(" ")[0]+" is notified and can reply.")}
<div class="col"><span class="muted" style="font-weight:700">What went wrong?</span><div class="row wrap">${["Did not show up","Job not finished","Poor quality","Charged more than the quote","Damage to my home","Something else"].map(r=>`<button class="chip ${S.dsp.r===r?"on":""}" data-dr="${r}">${r}</button>`).join("")}</div></div>
<label class="f"><span class="l">Tell us more</span><textarea class="ta" name="dtext" placeholder="Write in ${LNAME[myLang()]}. ${p.name.split(" ")[0]} reads it translated.">${esc(S.dsp.t||"")}</textarea></label>
<div class="col"><span class="muted" style="font-weight:700">Photos</span><div class="row">${["P1","P2"].map(k=>`<button type="button" class="photo ${S.dsp[k]?"done":""}" data-dp="${k}">${S.dsp[k]?ico("check","#fff",22):ico("plus","#56605C",20)}${S.dsp[k]?"Added":"Add photo"}</button>`).join("")}</div></div>
${err.dr?`<span class="errt">${err.dr}</span>`:""}
<div class="note">${ico("shield","#16201D",16)}<span>This does not affect your legal rights against the provider for faulty work.</span></div>
<div class="foot"><button class="btn a" data-act="sendDispute">Report and hold payment</button></div>`},

saved:()=>{ensure();const list=S.saved.map(find).filter(Boolean);return `${bar()}${head("Saved providers",list.length?"Book the people you trust again in two taps.":"Tap the star on any profile to save it here.")}<div class="col grid2" style="gap:12px">${list.map(p=>pcard(p)).join("")}</div>${list.length?"":`<button class="btn s" data-nav="ehome">Find a service</button>`}`},

report:()=>{const t=S.reportTarget||{};S.rp=S.rp||"";return `${bar()}${head("Report "+esc(t.name||"this content"),"Reports are reviewed by a person. We tell you what we decided and why.")}
<div class="col">${["Fake profile or impersonation","Offensive or discriminatory content","Asked to pay outside Kodu","Unsafe behaviour","Spam or scam","Something else"].map(r=>`<button class="row" style="gap:10px;background:none;border:none;padding:8px 0;font:inherit;font-size:15px;text-align:left" data-rp="${r}"><span class="radio ${S.rp===r?"on":""}"></span>${r}</button>`).join("")}</div>
<label class="f"><span class="l">Details (optional)</span><textarea class="ta" name="rptext"></textarea></label>
<div class="foot"><button class="btn p" data-act="sendReport" ${S.rp?"":"disabled"}>Send report</button></div>`},

pay:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);const q=quote(j);S.payMethod=S.payMethod||"Visa";return `${bar()}${head("Pay securely","Money is held by Kodu, not sent to the provider, until you confirm the job.")}
<div class="card col" style="gap:0;padding:6px 16px">${[["Labour",money(q.labour)],["Materials",money(j.materials)],["Kodu service fee",money(q.fee)]].map(([a,b])=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid #EDE8DF;font-size:15px"><span>${a}</span><b style="font-family:Sora,sans-serif">${b}</b></div>`).join("")}<div class="row between" style="padding:12px 0;font-size:17px;color:var(--green)"><b>Total held in escrow</b><b style="font-family:Sora,sans-serif">${money(q.total)}</b></div></div>
<div class="col">${[["Visa","Ending 4421","VISA"],["Apple Pay",first()+"'s iPhone","APPL"],["Revolut","Ending 0912","REV"]].map(([t,s,g])=>`<button class="pm ${S.payMethod===t?"on":""}" data-pay="${t}"><span class="tag">${g}</span><span style="flex:1"><b>${t}</b><small>${s}</small></span><span class="radio ${S.payMethod===t?"on":""}"></span></button>`).join("")}</div>
<div class="note">${ico("lock","#16201D",16)}<span><b>Held in escrow.</b> Released to ${p.name.split(" ")[0]} when you confirm, or automatically 72 h after the visit. Cancelling within 24 h of the slot costs €15.</span></div>
<p class="muted" style="line-height:1.45">By paying you agree to the booking terms. Payments are processed by Stripe; Kodu never stores your card number.</p>
<div class="foot"><button class="btn a" data-act="payNow">${ico("lock","#fff",20)}Pay ${money(q.total)} with ${S.payMethod}</button></div>`},

paid:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);return `<div class="col center" style="margin:auto;width:100%;align-items:center;gap:14px"><span class="eic" style="width:120px;height:120px;border-radius:60px">${ico("check","#0E5A4C",56)}</span><h2>Booked for ${j.day} ${j.slot}</h2><p class="sub">${money(quote(j).total)} is held safely. ${p.name.split(" ")[0]} has your full address now and will message you in ${LNAME[myLang()]}.</p>
<div class="card col" style="text-align:left;width:100%;gap:8px">${[["Confirmation","Sent to "+esc(S.email||"your email")],["Address shared","Yes, after payment only"],["Cancel for free","Until "+j.day+" "+j.slot+", minus 24 h"]].map(([a,b])=>`<div class="row between" style="font-size:14px"><span class="muted">${a}</span><b style="text-align:right">${b}</b></div>`).join("")}</div></div>
<div class="foot"><button class="btn p" data-chat="${p.id}">Open chat with ${p.name.split(" ")[0]}</button><button class="btn s" data-nav="bookings">See my bookings</button></div>`},

rate:()=>{const j=S.jobs2.find(x=>x.id===S.jobId);const p=find(j.pid);S.rv=S.rv||{stars:0,tags:[]};return `${bar()}<div class="col center" style="align-items:center;gap:12px">${av(p,72)}<h2>How was ${p.name.split(" ")[0]}?</h2><p class="sub">Only expats can review, and reviews are shown with your language.</p>
<div class="row" style="gap:8px">${[1,2,3,4,5].map(i=>`<button class="starb ${i<=S.rv.stars?"on":""}" data-star="${i}" aria-label="${i} stars">★</button>`).join("")}</div>
<div class="row wrap" style="justify-content:center;gap:6px">${["On time","Clear price","Spoke my language","Tidy","Would book again"].map(t=>`<button class="chip ${S.rv.tags.includes(t)?"on":""}" data-rtag="${t}">${t}</button>`).join("")}</div></div>
<label class="f"><span class="l">A few words (optional)</span><textarea class="ta" name="rvtext" placeholder="Write in ${LNAME[myLang()]}">${esc(S.rv.text||"")}</textarea></label>
<div class="foot"><button class="btn p" data-act="sendReview">Send review</button></div>`},

  if(d.book){S.view=d.book;S.draft=d.day?{day:d.day,slot:d.slot}:{};save();go("book");return}
  if(d.chat){openChat(d.chat);return}
  if(d.job){S.jobId=d.job;save();go("job");return}
  if(d.day&&route==="slots"){S.draft.day=d.day;S.draft.slot=null;save();render();return}
  if(d.pick){S.draft.slot=d.pick;S.draft.day=S.draft.day||Object.keys(find(S.view).slots)[0];save();render();return}

  const a=d.act;

  if(a==="resetF"){S.f={lang:true,verified:true,avail:"This week",max:60,sort:"Best match",area:"",day:"",time:"",minR:0,lic:false,fast:false,city:"Tallinn",langSel:"",pricing:""};S.cat="";save();render();return}

  if(a==="togOrig"){S.showOrig=S.showOrig===false?true:false;save();render();return}
  if(a==="attach"){toast("Photo attached");return}
  if(a==="sendRequest"){if(!S.draft.slot){err={slot:"Pick a time slot"};render();return}const p=find(S.view);const id="j"+Date.now();const j={id,pid:p.id,title:S.draft.title,desc:S.draft.desc,urgency:S.urgency||"This week",photos:["Photo 1","Photo 2"].filter(k=>S.draft[k]).length,day:S.draft.day,slot:S.draft.slot,status:"requested",hours:1.5,materials:0,matDesc:""};S.jobs2.push(j);S.jobId=id;if(!S.chats[p.id])openChat(p.id);const c=S.chats[p.id];c.msgs.push({me:true,text:`Hi ${p.name.split(" ")[0]}, ${j.title.toLowerCase()}. ${j.desc||""} Could you come ${j.day} at ${j.slot}?`,orig:`(${LNAME[myLang()]} original)`,when:"now"});c.t=Date.now();S.draft={};save();history=[];go("job");toast("Request sent and translated");providerReplies(p.id);return}

  if(d.qr){const f=document.querySelector("form[data-form=msg],form[data-form=pmsg]");if(!f)return;f.msg.value=d.qr;f.requestSubmit();return}

const PST={new:["New request","rev"],quoted:["Quote sent","rev"],paid:["Booked, paid","ok"],done:["Awaiting confirmation","rev"],released:["Paid out","dark"],disputed:["Problem reported","err"],declined:["Declined","gray"],cancelled:["Cancelled","gray"]};

function pensure(){

  S.myReplies=S.myReplies||["I can come at the booked time","Please send a photo of the problem","I am on my way","The job is finished"];
  S.qtpl=S.qtpl||[{name:"Small repair, 1 h",hours:1,materials:pMat()[1],matDesc:pMat()[0]},{name:"Standard job, 2 h",hours:2,materials:pMat()[1],matDesc:pMat()[0]},{name:"Site visit first",qtype:"visit",visitFee:25}];
  if(!S.avail){S.avail={};["Mon","Tue","Wed","Thu","Fri"].forEach(d=>S.avail[d]=["09:00","11:00","14:00"]);S.avail.Sat=["10:00"];S.avail.Sun=[]}
  if(!S.pjobs){const reqs=REQ_BY_CAT[pTrade()]||REQ_BY_CAT.Plumbing;const DN={Mon:13,Tue:14,Wed:15,Thu:16,Fri:17,Sat:18,Sun:19};S.pjobs=reqs.map(([t,d,ph,day,slot],i)=>({id:"r"+(i+1),eid:EXPATS[i].id,title:t,desc:d,photos:ph,day,slot,date:DN[day],status:i===2?"paid":"new",urgency:["This week","Flexible","This week"][i],hours:1.5,materials:i===2?pMat()[1]:0,matDesc:i===2?pMat()[0]:"",ago:["12 min ago","1 h ago","yesterday"][i],paidAt:i===2?"yesterday":null}));
    S.pjobs.push({id:"r0",eid:"e4",title:"Previous job: "+reqs[1][0].toLowerCase(),desc:reqs[1][1],photos:1,day:"Fri",slot:"10:00",date:9,status:"released",hours:2,materials:pMat()[1],matDesc:pMat()[0],ago:"last week",paidAt:"last week"});
    const extra=[[2,"Fri","09:00","e2","released"],[5,"Mon","14:00","e3","released"],[7,"Wed","11:00","e1","released"],[21,"Wed","09:00","e2","paid"],[23,"Fri","14:00","e4","paid"],[28,"Wed","10:00","e3","paid"],[30,"Fri","09:00","e1","paid"]];
    extra.forEach(([date,day,slot,eid,st],i)=>{const r=reqs[i%reqs.length];S.pjobs.push({id:"x"+i,eid,title:r[0],desc:r[1],photos:r[2],day,slot,date,status:st,hours:[1,1.5,2][i%3],materials:pMat()[1],matDesc:pMat()[0],ago:(st==="released"?"done ":"")+day+" "+date+" Oct",paidAt:st==="released"?"earlier":"last week"})});
    EXTRA_REQ.forEach(([t,d,ph,day,date,slot],i)=>{S.pjobs.push({id:"n"+i,eid:EXPATS[4+(i%4)].id,title:t,desc:d,photos:ph,day,slot,date,status:"new",urgency:i===4?"Urgent":i===2?"Urgent":["This week","Flexible","This week","Flexible","Urgent"][i],hours:1.5,materials:0,matDesc:"",ago:["25 min ago","2 h ago","3 h ago","this morning","5 min ago"][i]})});
    S.pjobs.forEach(j=>{if(!S.pchats[j.eid]){const e=ex(j.eid);S.pchats[j.eid]={eid:j.eid,t:Date.now()-Math.random()*1e7,unread:j.status==="new"?1:0,msgs:[{sys:true,text:`Chat with ${e.name.split(" ")[0]} started · translated automatically`},{text:`Hi ${pFirst()}, ${j.title.toLowerCase()}. ${j.desc} Could you come ${j.day} at ${j.slot}?`,orig:`(${LNAME[e.lang]} original)`,when:j.ago,req:j.id}]}}})}
  save();
}

function freeSlots(j){const out=[];for(const [d] of DAYS){if(d===j.day)continue;for(const t of (S.avail[d]||[])){if(!isBlocked(d,t))out.push([d,t]);if(out.length>=6)return out}}return out}
const WEEK_DN={Mon:13,Tue:14,Wed:15,Thu:16,Fri:17,Sat:18,Sun:19};
function blockers(d){return S.pjobs.filter(j=>["paid","done"].includes(j.status)&&j.day===d&&j.date===WEEK_DN[d])}
function isBlocked(d,t){const h=+t.slice(0,2);return blockers(d).some(j=>{const s=+j.slot.slice(0,2);const len=Math.ceil(+(j.hoursMax||j.hours)||1);return h>=s&&h<s+len})}
function pavail(){const T=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"];
 return `<p class="sub">Tap a slot to open or close it. Booked jobs block the hours they take, so you cannot be double booked.</p>
 <div class="row wrap" style="gap:8px"><button class="btn g sm" data-avact="copymon">Copy Monday to weekdays</button><button class="btn s sm" data-avact="copyall">Copy Monday to every day</button></div>
 <div class="col" style="gap:10px">${DAYS.map(([d,n])=>`<div class="card col" style="gap:8px;padding:12px 14px"><div class="row between"><b>${d} ${n} Oct</b><span class="row" style="gap:10px"><span class="muted">${S.avail[d].filter(t=>!isBlocked(d,t)).length} open</span><button class="link" style="font-size:13px" data-avact="clear" data-d="${d}">Clear</button><button class="link" style="font-size:13px" data-avact="full" data-d="${d}">Full day</button></span></div><div class="row wrap" style="gap:6px">${T.map(t=>{const b=isBlocked(d,t);const job=b&&blockers(d).find(j=>{const s=+j.slot.slice(0,2);return +t.slice(0,2)>=s});return b?`<button class="slot booked" data-preq="${job.id}" title="${esc(job.title)}">${t}<small>booked</small></button>`:`<button class="slot ${S.avail[d].includes(t)?"sel":""}" data-slot="${d}" data-t="${t}">${t}</button>`}).join("")}</div></div>`).join("")}</div>`}
function pcal(){
  S.calM=S.calM||0;S.calView=S.calView||"Month";
  const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const m=9+S.calM;const y=2026+Math.floor(m/12);const mm=((m%12)+12)%12;
  const dot={new:"#F2C14E",quoted:"#F2C14E",paid:"#0E5A4C",done:"#0E5A4C",disputed:"#D9643A",released:"#16201D"};
  const jobsOn=(yy,mo,d)=>(yy===2026&&mo===9)?S.pjobs.filter(j=>j.date===d&&!["declined","cancelled"].includes(j.status)).sort((a,b)=>a.slot.localeCompare(b.slot)):[];
  const dn=(yy,mo,d)=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(yy,mo,d).getDay()];
  const end=(j)=>{const s=+j.slot.slice(0,2);const len=+(j.hoursMax||j.hours)||1;const e=s+len;return String(Math.floor(e)).padStart(2,"0")+":"+(e%1?"30":"00")};
  const head=`<div class="row between"><div class="row" style="gap:6px"><button class="ib" style="width:36px;height:36px" data-calnav="-1" aria-label="Previous">${ico("back","#16201D",16)}</button><b style="font-family:Sora,sans-serif;font-size:17px;min-width:150px;text-align:center">${S.calView==="Month"?MN[mm]+" "+y:"Week of "+(()=>{const w=new Date(2026,9,12+7*(S.calW||0));return w.getDate()+" "+MN[w.getMonth()].slice(0,3)})()}</b><button class="ib" style="width:36px;height:36px" data-calnav="1" aria-label="Next"><span style="display:inline-flex;transform:rotate(180deg)">${ico("back","#16201D",16)}</span></button></div><div class="segm" style="width:150px">${["Month","Week"].map(v=>`<button class="${S.calView===v?"on":""}" data-calview="${v}">${v}</button>`).join("")}</div></div>`;
  let body="";
  if(S.calView==="Week"){const start=new Date(2026,9,12+7*(S.calW||0));
    body=`<div class="col" style="gap:8px">${Array.from({length:7},(_,i)=>{const dt=new Date(start);dt.setDate(start.getDate()+i);const js=jobsOn(dt.getFullYear(),dt.getMonth(),dt.getDate());const today=dt.getMonth()===9&&dt.getDate()===11;return `<div class="wkrow ${today?"today":""}"><span class="wkday"><small>${dn(dt.getFullYear(),dt.getMonth(),dt.getDate())}</small><b>${dt.getDate()}</b></span><span class="wkjobs">${js.length?js.map(j=>`<button class="wkjob" style="border-left-color:${dot[j.status]}" data-preq="${j.id}"><b>${j.slot} to ${end(j)}</b> ${esc(j.title)}<span class="muted"> · ${ex(j.eid).name}</span></button>`).join(""):`<span class="muted" style="font-size:13px">No jobs</span>`}</span></div>`}).join("")}</div>`;
  } else {
    const first=(new Date(y,mm,1).getDay()+6)%7;const days=new Date(y,mm+1,0).getDate();const sel=S.calM===0?S.calDay:null;
    const cells=[];for(let i=0;i<first;i++)cells.push('<span class="cc empty"></span>');
    for(let d=1;d<=days;d++){const js=jobsOn(y,mm,d);cells.push(`<button class="cc ${js.length?"has":""} ${S.calM===0&&d===11?"today":""} ${sel===d?"sel":""}" data-cal="${d}" ${js.length?"":"disabled"}><b>${d}</b><span class="dots2">${js.slice(0,3).map(j=>`<i style="background:${dot[j.status]}"></i>`).join("")}</span></button>`)}
    body=`<div class="cal"><span class="ch">Mon</span><span class="ch">Tue</span><span class="ch">Wed</span><span class="ch">Thu</span><span class="ch">Fri</span><span class="ch">Sat</span><span class="ch">Sun</span>${cells.join("")}</div>${S.calM!==0?`<p class="muted center">No jobs booked in ${MN[mm]} yet.</p>`:""}`;

:`<table class="rt"><tr><th>Item</th><th style="text-align:right">Amount</th></tr><tr><td>${esc(j.title)}, ${j.day} ${j.date} Oct, ${qmeta(j)==="visit"?"site visit":qmeta(j)==="range"?"up to "+j.hoursMax+" h":j.hours+" h"}</td><td style="text-align:right">${money(q.labour)}</td></tr>${q.mat?`<tr><td>Materials: ${esc(j.matDesc)}</td><td style="text-align:right">${money(q.mat)}</td></tr>`:""}${j.refundPart?`<tr><td>Refund agreed in dispute</td><td style="text-align:right">−${money((q.labour+q.mat)*j.refundPart)}</td></tr>`:""}<tr class="tot"><td>Total for your work</td><td style="text-align:right">${money(q.net)}</td></tr><tr><td class="muted">Kodu service fee, paid by the customer</td><td class="muted" style="text-align:right">${money(q.fee)}</td></tr></table><p class="muted" style="font-size:12px">Paid through Kodu escrow and released after the customer confirmed the job. Keep this document for your accounts.</p>`}</div>
<div class="row" style="gap:10px"><button class="btn p" style="flex:1" onclick="window.print()">${ico("send","#fff",18)}Save as PDF or print</button></div>`};

</script>
<script>
const LEGAL={"terms": {"title": "Terms of Service", "html": "<p>Effective date: 25 October 2026</p>\n<p>These Terms govern your use of the Kodu website and apps (the Platform). Kodu is operated by [Kodu OÜ], registry code [00000000], [street address], Tallinn, Estonia (Kodu, we, us). By creating an account you accept these Terms. If you register as a service provider, the Provider Agreement also applies to you.</p>\n<h2>1. What Kodu does</h2>\n<p>Kodu is an online marketplace that connects people who need work done at home (Customers) with independent tradespeople and businesses (Providers) for plumbing, electrical work, painting, cleaning, handyman tasks and moving. Kodu offers search, translated chat, quoting, booking, payment handling and reviews.</p>\n<p>Kodu is not a party to the service contract between a Customer and a Provider. Each job is a contract directly between them. Kodu does not employ Providers, does not direct how they work and is not responsible for the work itself, except where these Terms or mandatory law say otherwise.</p>\n<h2>2. Who can use Kodu</h2>\n<p>You must be at least 18 years old and able to enter into binding contracts. You must give accurate information when you register and keep it up to date. One person may hold one Customer account and one Provider account. You are responsible for everything done through your account, so keep your password and verification code private.</p>\n<h2>3. Booking a job</h2>\n<p>A Customer describes the job, chooses a time slot and sends a request. The Provider may reply with a quote. A quote shows labour (hourly or fixed price), materials and the Kodu service fee as one total. A contract between the Customer and the Provider is formed when the Customer accepts the quote and pays. The price in an accepted quote does not change unless both sides agree a new quote in the app.</p>\n<p>If the Customer has told us that a landlord arranges repairs, Kodu may send the landlord the job description, the quote and the Provider profile so the landlord can approve it. The landlord never sees the chat.</p>\n<h2>4. Payment and escrow</h2>\n<p>Payments are processed by our licensed payment partner, [Stripe Payments Europe Ltd.]. Kodu never stores full card numbers. When the Customer pays, the money is held by the payment partner on behalf of the Provider until one of the following happens:</p>\n<ol>\n<li>the Customer confirms in the app that the job is done;</li>\n<li>72 hours pass after the booked slot without the Customer opening a dispute; or</li>\n<li>a dispute is resolved under section 7.</li>\n</ol>\n<p>The money is then released to the Provider in full. The Kodu service fee of 10 percent is shown to the Customer in the quote and paid by the Customer as part of the total.</p>\n<h2>5. Cancellations</h2>\n<p>A Customer may cancel a request at no cost before paying. After paying, a Customer may cancel free of charge until 24 hours before the booked slot. Cancelling later costs a late cancellation fee of €15, which goes to the Provider; the rest is refunded. If the Provider cancels, the Customer receives a full refund.</p>\n<h2>6. Your right of withdrawal as a consumer</h2>\n<p>If you are a consumer, you have a legal right to withdraw from a service contract concluded online within 14 days. By booking a slot that falls inside those 14 days, you ask the Provider to start work before the withdrawal period ends. If you withdraw after work has started, you pay for the part already done. Once the work is fully performed, the right of withdrawal ends. This does not affect your rights if the work is faulty.</p>\n<h2>7. Problems with a job and disputes</h2>\n<p>If something goes wrong, open a dispute from the job page before the money is released. Kodu will hold the payment, ask both sides for information and photos, and propose a resolution, which may be a full release, a partial refund or a full refund. This process does not limit your statutory rights against the Provider for faulty work. Consumers may also bring a complaint to the Consumer Disputes Committee of the Estonian Consumer Protection and Technical Regulatory Authority, or to the courts.</p>\n<h2>8. Translation</h2>\n<p>Chat messages, requests and quotes are translated automatically by machine translation. Translations may contain mistakes. The original text is always shown under each translation and is the version that counts if there is a disagreement. Do not rely on a translation alone for safety critical instructions.</p>\n<h2>9. How results are ranked</h2>\n<p>Search results are ranked by: whether the Provider speaks one of your languages at level B2 or better, availability in your chosen slot, distance to your district, rating from Customer reviews, and reliability (the share of bookings started on time). Providers cannot pay for a higher position. Sponsored placements, if ever introduced, will be clearly labelled.</p>\n<h2>10. Reviews</h2>\n<p>Only Customers who have completed and paid for a job can review that Provider. Reviews must be honest and about the job. We do not edit reviews, but we remove reviews that break section 11. Ratings shown on profiles are averages of Customer reviews only.</p>\n<h2>11. What is not allowed</h2>\n<p>You must not: use Kodu for anything illegal; arrange to pay outside Kodu for a job found through Kodu in order to avoid the fee; post false, offensive or discriminatory content; harass other users; share another person's personal data without a reason; create fake accounts or fake reviews; or interfere with the security of the Platform.</p>\n<h2>12. Reporting illegal content</h2>\n<p>Anyone can report content they believe is illegal or breaks these Terms using the Report option on any profile, review or message, or by writing to [legal@kodu.ee]. We will confirm receipt, review the report diligently and tell you what we decided and why. If we remove content or restrict an account, we will explain the reason to the affected user, who may appeal through the app within six months.</p>\n<h2>13. Suspension and closing accounts</h2>\n<p>You can close your account at any time from Profile, Privacy and data. We may suspend or close an account that breaks these Terms, after giving reasons, and immediately where needed to protect other users. Open jobs and payments held in escrow are settled before an account is closed.</p>\n<h2>14. Liability</h2>\n<p>Kodu is responsible for running the Platform with reasonable care. Kodu is not liable for the work a Provider performs, for damage a Provider causes, or for what users say to each other, unless Kodu itself acted wrongly. Nothing in these Terms limits liability for death or personal injury caused by negligence, for intent or gross negligence, or any other liability that cannot be limited by law.</p>\n<h2>15. Changes to these Terms</h2>\n<p>We will tell you about material changes at least 30 days before they apply. If you do not agree, you may close your account before the changes take effect.</p>\n<h2>16. Law and courts</h2>\n<p>These Terms are governed by Estonian law. If you are a consumer living in another EU country, you also keep the protection of the mandatory consumer law of that country, and you may bring proceedings in the courts where you live.</p>\n<h2>17. Contact</h2>\n<p>[Kodu OÜ], [street address], Tallinn, Estonia. Email: [hello@kodu.ee]. Legal and content reports: [legal@kodu.ee].</p>"}, "privacy": {"title": "Privacy Notice", "html": "<p>Effective date: 25 October 2026</p>\n<p>This notice explains how Kodu handles personal data when you use the Kodu website and apps. The controller is [Kodu OÜ], registry code [00000000], [street address], Tallinn, Estonia. You can reach us at [privacy@kodu.ee].</p>\n<h2>1. What we collect</h2>\n<p><strong>Account data.</strong> Name, email, phone number, password (stored only as a hash), role (Customer or Provider), app language.</p>\n<p><strong>Profile data.</strong> Languages you speak and your level in each, city and district, home address, housing type, whether a landlord arranges repairs, and your landlord's name and contact details if you give them to us.</p>\n<p><strong>Provider data.</strong> Trade and job types, areas covered, prices, availability, licence or registration number, VAT number, trading form (sole trader or company), IBAN and payout preferences.</p>\n<p><strong>Verification data (Providers).</strong> Photos of an identity document, a selfie and a licence. These are checked by our verification partner and are deleted after the check; we keep only the result and the date.</p>\n<p><strong>Job data.</strong> Requests, descriptions, photos you upload, quotes, bookings, cancellations, disputes and reviews.</p>\n<p><strong>Messages.</strong> Chat messages and their machine translations.</p>\n<p><strong>Payment data.</strong> Payment status, amounts and the last four digits of a card. Full card details go directly to our payment partner and are never stored by Kodu.</p>\n<p><strong>Technical data.</strong> Device type, browser, IP address, log in times and, only if you agree, usage statistics.</p>\n<h2>2. Why we use it and on what legal basis</h2>\n<table>\n<thead>\n<tr>\n<th>Purpose</th>\n<th>Legal basis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Creating your account, matching Customers with Providers, bookings, chat, translation, payments and payouts</td>\n<td>Performance of the contract (GDPR Art. 6(1)(b))</td>\n</tr>\n<tr>\n<td>Verifying Provider identity and licence</td>\n<td>Legitimate interest in keeping Customers safe (Art. 6(1)(f))</td>\n</tr>\n<tr>\n<td>Sending the quote to your landlord when you ask us to</td>\n<td>Performance of the contract at your request</td>\n</tr>\n<tr>\n<td>Bookkeeping, tax reporting under DAC7, anti money laundering checks by our payment partner</td>\n<td>Legal obligation (Art. 6(1)(c))</td>\n</tr>\n<tr>\n<td>Preventing fraud, fake reviews and misuse</td>\n<td>Legitimate interest (Art. 6(1)(f))</td>\n</tr>\n<tr>\n<td>Handling disputes and reports of illegal content</td>\n<td>Legitimate interest and legal obligation under the Digital Services Act</td>\n</tr>\n<tr>\n<td>Tips for settling in Estonia and other marketing emails</td>\n<td>Consent (Art. 6(1)(a)), which you can withdraw at any time</td>\n</tr>\n<tr>\n<td>Analytics cookies</td>\n<td>Consent, see the Cookie Policy</td>\n</tr>\n</tbody>\n</table>\n<p>Data about your languages is used only to match you with Providers. We do not use it to infer nationality or ethnic origin, and we do not use any special category data.</p>\n<h2>3. Who sees your data</h2>\n<p><strong>Other users.</strong> Providers see a Customer's first name, languages and district before payment, and the full address only after payment. Customers see a Provider's public profile. A landlord you name sees the job, the quote and the Provider profile, never the chat.</p>\n<p><strong>Service providers acting for us.</strong> Payment processing [Stripe Payments Europe Ltd., Ireland]; identity verification [verification partner]; machine translation [translation provider]; hosting [hosting provider, EU region]; email and SMS delivery [provider]. Each works under a data processing agreement and only on our instructions.</p>\n<p><strong>Authorities.</strong> The Estonian Tax and Customs Board receives annual Provider earnings reports where the DAC7 thresholds are met. We share data with other authorities only where the law requires it.</p>\n<p>We do not sell personal data.</p>\n<h2>4. Transfers outside the EU</h2>\n<p>We aim to keep data in the European Economic Area. If a service provider processes data outside the EEA, we rely on an adequacy decision or the European Commission's standard contractual clauses, and you can ask us for a copy of the safeguards.</p>\n<h2>5. How long we keep it</h2>\n<table>\n<thead>\n<tr>\n<th>Data</th>\n<th>Kept for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Account and profile</td>\n<td>While your account is open, then deleted within 30 days</td>\n</tr>\n<tr>\n<td>Identity documents and selfies</td>\n<td>Deleted after the verification check</td>\n</tr>\n<tr>\n<td>Jobs, quotes, payments and invoices</td>\n<td>7 years, as required by the Estonian Accounting Act</td>\n</tr>\n<tr>\n<td>Chat messages</td>\n<td>2 years after the last message in a conversation, longer only if part of a dispute</td>\n</tr>\n<tr>\n<td>Reviews</td>\n<td>While the Provider's profile exists; shown with your first name and initial only</td>\n</tr>\n<tr>\n<td>Technical logs</td>\n<td>90 days</td>\n</tr>\n</tbody>\n</table>\n<h2>6. Your rights</h2>\n<p>You can ask to access, correct, delete or download your data, to restrict or object to its use, and to withdraw consent at any time. Most of this can be done in Profile, Privacy and data. Otherwise write to [privacy@kodu.ee]; we reply within one month. You also have the right to complain to the Estonian Data Protection Inspectorate (Andmekaitse Inspektsioon), Tatari 39, 10134 Tallinn, info@aki.ee, or to the authority in your own EU country.</p>\n<h2>7. Automated decisions</h2>\n<p>Kodu ranks search results automatically, as described in section 9 of the Terms of Service. Ranking does not have legal or similarly significant effects on you. Kodu does not make decisions about you based solely on automated processing that have such effects; account restrictions are always reviewed by a person.</p>\n<h2>8. Security</h2>\n<p>Data is encrypted in transit and at rest, access is limited to staff who need it, and payments are handled by a PCI DSS certified partner. If a breach is likely to put your rights at high risk, we will tell you without undue delay.</p>\n<h2>9. Children</h2>\n<p>Kodu is not for anyone under 18. We do not knowingly collect their data.</p>\n<h2>10. Changes</h2>\n<p>We will tell you in the app before any material change to this notice takes effect.</p>"}, "provider": {"title": "Provider Agreement", "html": "<p>Effective date: 25 October 2026</p>\n<p>This Agreement is between [Kodu OÜ], registry code [00000000], Tallinn, Estonia (Kodu) and you, the person or company offering services through Kodu (Provider). It applies together with the Terms of Service. If they conflict, this Agreement applies to you as a Provider.</p>\n<h2>1. Your status</h2>\n<p>You are an independent business. You decide whether to accept a request, what to quote, when you work and how you do the job. Nothing in this Agreement makes you an employee, worker or agent of Kodu. You are responsible for your own taxes, social contributions, insurance and permits.</p>\n<h2>2. Eligibility and verification</h2>\n<p>To receive bookings you must:</p>\n<ol>\n<li>be at least 18 and legally allowed to work in Estonia;</li>\n<li>pass identity verification through our partner;</li>\n<li>hold any licence or qualification your trade requires in Estonia, including electrical work qualifications where applicable, and keep it valid;</li>\n<li>register as a sole trader (FIE) or a company, and give us your VAT number if you are VAT registered; companies must provide a VAT number;</li>\n<li>give us a valid IBAN in your own or your company's name.</li>\n</ol>\n<p>You must tell us within 7 days if any of this changes. Kodu may pause your profile until checks are updated.</p>\n<h2>3. Your profile</h2>\n<p>Your profile must be accurate. Language levels must be honest: Customers rely on them. Prices, areas and availability must be kept current. Photos must be of your own work.</p>\n<h2>4. Quotes and jobs</h2>\n<p>A quote you send is a binding offer for the described job at the stated price, valid for 24 hours. You may not charge more than the accepted quote unless the Customer accepts a new quote in the app before the extra work. You must arrive at the agreed time, do the work with reasonable skill and care, follow safety rules, and photograph the finished work.</p>\n<h2>5. Fees and payment</h2>\n<p>Kodu charges the Customer a service fee of 10 percent of labour and materials. You receive the full quoted amount for labour and materials. Money is held by our payment partner until the Customer confirms the job, 72 hours pass after the slot without a dispute, or a dispute is resolved. Payouts are made weekly on Mondays free of charge, or within 30 minutes for a fee of 1 percent if you choose instant payout.</p>\n<h2>6. Cancellations and reliability</h2>\n<p>If you cancel a paid booking, the Customer is refunded in full and your reliability score falls. Repeated late cancellations or no shows may lead to your profile being paused. If the Customer cancels within 24 hours of the slot, you receive the €15 late cancellation fee.</p>\n<h2>7. Disputes</h2>\n<p>If a Customer opens a dispute you will be asked for your account and photos within 48 hours. Kodu decides how the held money is released and explains its decision. You keep your legal rights against the Customer.</p>\n<h2>8. Off platform payments</h2>\n<p>For 12 months after you are first introduced to a Customer through Kodu, you must not arrange to be paid outside Kodu for work with that Customer. Breaking this rule may lead to your account being closed.</p>\n<h2>9. Ranking</h2>\n<p>Your position in search depends on: languages you speak at B2 or better, availability in the requested slot, distance, rating and reliability. You cannot pay to rank higher.</p>\n<h2>10. Restriction, suspension and termination</h2>\n<p>Kodu will give you at least 30 days notice, with reasons, before ending this Agreement for convenience. Kodu may restrict or suspend your account earlier, with a statement of reasons, if you break this Agreement, the law or safety rules. You can appeal any restriction through our internal complaint process, which is free and answered within 14 days. You may also use mediation under the EU Platform to Business Regulation; our named mediators are [mediator name and address].</p>\n<h2>11. Tax reporting</h2>\n<p>Under EU rules (DAC7), Kodu reports to the Estonian Tax and Customs Board the identity and earnings of Providers who earn more than €2,000 or complete 30 or more jobs a year. You will receive a copy of the reported information each January.</p>\n<h2>12. Insurance and liability</h2>\n<p>You should hold public liability insurance suitable for your trade. You are liable to Customers for damage you cause and for the quality of your work. Kodu's liability towards you is limited to the fees Kodu earned from your jobs in the 12 months before the claim, except where the law does not allow a limit.</p>\n<h2>13. Data</h2>\n<p>You may use Customer details only to carry out the booked job. After the job you must delete any address or contact details you copied outside the app, unless you need them by law. Each side is a separate controller for the data it holds; see the Privacy Notice.</p>\n<h2>14. Changes</h2>\n<p>Kodu will give you at least 15 days notice of changes to this Agreement, or longer where the change requires you to make significant adjustments. You may end the Agreement before the change takes effect.</p>\n<h2>15. Law</h2>\n<p>This Agreement is governed by Estonian law. Courts in Tallinn (Harju County Court) have jurisdiction.</p>"}, "cookies": {"title": "Cookie Policy", "html": "<p>Effective date: 25 October 2026</p>\n<p>Kodu uses a small number of cookies and similar storage in your browser. We ask for your consent before using anything that is not strictly necessary, and you can change your choice at any time in Profile, Privacy and data.</p>\n<h2>Strictly necessary</h2>\n<table>\n<thead>\n<tr>\n<th>Name</th>\n<th>Purpose</th>\n<th>Kept for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>kodu_session</td>\n<td>Keeps you logged in</td>\n<td>Until you log out, at most 30 days</td>\n</tr>\n<tr>\n<td>kodu_csrf</td>\n<td>Protects forms against cross site attacks</td>\n<td>Session</td>\n</tr>\n<tr>\n<td>kodu_consent</td>\n<td>Remembers your cookie choice</td>\n<td>12 months</td>\n</tr>\n<tr>\n<td>kodu.proto (local storage)</td>\n<td>Saves app state such as filters and drafts on your device</td>\n<td>Until you log out or clear it</td>\n</tr>\n</tbody>\n</table>\n<h2>Analytics (only with consent)</h2>\n<table>\n<thead>\n<tr>\n<th>Name</th>\n<th>Purpose</th>\n<th>Kept for</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>kodu_an</td>\n<td>Counts visits and which screens are used, without identifying you, so we can improve the app</td>\n<td>13 months</td>\n</tr>\n</tbody>\n</table>\n<p>We do not use advertising or cross site tracking cookies.</p>\n<h2>Your choice</h2>\n<p>You can accept or refuse analytics in the cookie banner, change your mind later in the app, or block cookies in your browser. Blocking strictly necessary cookies will stop log in from working.</p>"}, "notice": {"title": "Legal notice", "html": "<p><strong>Operator:</strong> [Kodu OÜ]\n<strong>Registry code:</strong> [00000000], Estonian Commercial Register\n<strong>VAT number:</strong> [EE000000000]\n<strong>Address:</strong> [street address], Tallinn, Estonia\n<strong>Email:</strong> [hello@kodu.ee]\n<strong>Phone:</strong> [+372 0000 0000]</p>\n<p><strong>Single point of contact for authorities and users under the Digital Services Act:</strong> [legal@kodu.ee], in English or Estonian.</p>\n<p><strong>Data protection:</strong> [privacy@kodu.ee]. Supervisory authority: Estonian Data Protection Inspectorate, Tatari 39, 10134 Tallinn.</p>\n<p><strong>Consumer disputes:</strong> Consumer Disputes Committee, Estonian Consumer Protection and Technical Regulatory Authority, Endla 10a, 10122 Tallinn.</p>\n<p><strong>Payments:</strong> processed by [Stripe Payments Europe Ltd.], an authorised payment institution. Kodu does not hold customer funds itself.</p>\n<p><strong>Accessibility:</strong> we aim to meet WCAG 2.1 AA and the European Accessibility Act. Report barriers to [hello@kodu.ee].</p>"}};
SCREENS.legal=()=>{const k=S.legalDoc||"terms";const d=LEGAL[k];return `<div class="row" style="gap:10px;height:48px"><button class="ib" data-go="back" aria-label="Back">${ico("back")}</button><b style="font-family:Sora,sans-serif;font-size:18px">Legal</b></div>
<div class="row lchips" style="gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px">${Object.entries(LEGAL).map(([key,v])=>`<button class="chip ${key===k?"on":""}" data-legal="${key}">${v.title}</button>`).join("")}</div>
<div class="note">${ico("shield","#16201D",16)}<span>Prototype document for a university project. Names and codes in square brackets are placeholders and the text is not legal advice.</span></div>
<article class="legaldoc"><h1>${d.title}</h1>${d.html}</article><div style="height:24px"></div>`};
document.addEventListener("click",e=>{const t=e.target.closest("[data-legal]");if(!t)return;e.preventDefault();e.stopPropagation();S.legalDoc=t.dataset.legal;save();if(route==="legal"){render();const s=document.querySelector(".screen");if(s)s.scrollTop=0}else go("legal")},true);

</script>
